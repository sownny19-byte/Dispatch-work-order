<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標誌標線派工單控管系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 表單輸入框統一樣式類別 (由Tailwind處理，此處保留供特定覆寫) */
        .form-input {
            @apply w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm;
        }
        .form-label {
            @apply block text-sm font-medium text-slate-700 mb-1;
        }
        .section-title {
            @apply text-lg font-bold text-slate-800 bg-slate-100 p-2 rounded-md mb-4 flex items-center;
        }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">

    <div id="login-screen" class="fixed inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 flex items-center justify-center z-50">
        <div class="bg-white/95 backdrop-blur-sm p-10 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <i class="fa-solid fa-traffic-light text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">派工單控管系統</h2>
                <p class="text-slate-500 mt-2 text-sm">請登入以繼續管理標誌標線業務</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">選擇帳號</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <select id="login-user" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                            <option value="admin">系統管理員 (Admin)</option>
                            <option value="owner">機關業主 (Owner)</option>
                            <option value="super1">監造人員 (Supervisor)</option>
                            <option value="vendor1">施工廠商 (Vendor)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="login-pwd" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="請輸入密碼">
                    </div>
                </div>
                <button onclick="login()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition-all shadow-md mt-4">
                    登入系統
                </button>
                <div id="login-error" class="text-red-500 text-sm mt-3 hidden text-center bg-red-50 p-2 rounded border border-red-100">密碼錯誤或連線失敗，請重試。</div>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden flex h-screen bg-slate-50">
        
        <!-- 左側選單 (Sidebar) -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20">
            <!-- 系統標誌 -->
            <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800">
                <i class="fa-solid fa-traffic-light text-blue-400 mr-3 text-lg"></i>
                <span class="text-lg font-bold text-white tracking-wide">派工單系統</span>
            </div>
            
            <!-- 選單項目 -->
            <div class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                <div class="px-3 mb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">業務管理</div>
                <button onclick="showSection('work-orders')" class="w-full flex items-center px-3 py-2.5 text-sm rounded-lg hover:bg-slate-800 hover:text-white group transition-colors bg-slate-800 text-white">
                    <i class="fa-solid fa-file-signature w-5 text-blue-400 group-hover:text-blue-300"></i>
                    <span class="ml-2 font-medium">派工單總表</span>
                </button>
                
                <div id="menu-settings-group" class="hidden">
                    <div class="px-3 mt-6 mb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">系統維護</div>
                    <button onclick="showSection('settings')" class="w-full flex items-center px-3 py-2.5 text-sm rounded-lg hover:bg-slate-800 hover:text-white group transition-colors">
                        <i class="fa-solid fa-sliders w-5 text-slate-400 group-hover:text-white"></i>
                        <span class="ml-2 font-medium">系統與帳號設定</span>
                    </button>
                </div>
            </div>
            
            <!-- 使用者狀態與登出 -->
            <div class="p-4 bg-slate-950 border-t border-slate-800">
                <div class="flex items-center mb-4">
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="ml-3">
                        <div class="text-xs text-slate-400">目前身分</div>
                        <div id="current-role" class="text-sm font-bold text-white"></div>
                    </div>
                </div>
                <div class="flex items-center justify-between text-xs mb-4 px-1">
                    <span class="text-slate-400">系統狀態</span>
                    <span class="flex items-center text-emerald-400"><i class="fa-solid fa-circle text-[8px] mr-1.5 animate-pulse"></i>已連線</span>
                </div>
                <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-2 border border-slate-700 rounded-lg text-sm hover:bg-slate-800 hover:text-white transition-colors text-slate-300">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i> 安全登出
                </button>
            </div>
        </aside>

        <!-- 右側內容區 -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            <!-- 頂部導覽列 (Header) -->
            <header class="h-16 bg-white shadow-sm border-b border-slate-200 flex items-center justify-between px-8 shrink-0 z-10">
                <div class="text-lg font-medium text-slate-800" id="header-title">派工單總表</div>
                <div class="flex items-center space-x-4">
                    <button class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-bell"></i></button>
                    <button class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-circle-question"></i></button>
                </div>
            </header>

            <!-- 內容滾動區 -->
            <div class="flex-1 overflow-auto p-8">
                
                <!-- 派工單列表區 -->
                <div id="section-work-orders" class="max-w-7xl mx-auto">
                    
                    <!-- 操作列 -->
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                        <!-- 搜尋與篩選 (示意) -->
                        <div class="relative w-full sm:w-96">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" placeholder="搜尋派工單編號、地點或內容..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm shadow-sm">
                        </div>
                        
                        <button id="btn-add-wo" onclick="openModal('add')" class="w-full sm:w-auto bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 shadow-sm hover:shadow transition-all flex items-center justify-center font-medium hidden">
                            <i class="fa-solid fa-plus mr-2"></i>新增派工單
                        </button>
                    </div>

                    <!-- 資料表卡片 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                                        <th class="p-4 font-semibold">派工單編號</th>
                                        <th class="p-4 font-semibold">年度/分區</th>
                                        <th class="p-4 font-semibold">派工內容</th>
                                        <th class="p-4 font-semibold">收單日期</th>
                                        <th class="p-4 font-semibold">狀態</th>
                                        <th class="p-4 font-semibold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="wo-table-body" class="divide-y divide-slate-100 text-sm">
                                    <!-- JS 生成內容 -->
                                </tbody>
                            </table>
                        </div>
                        <!-- 分頁列 (示意) -->
                        <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex items-center justify-between sm:px-6">
                            <div class="text-sm text-slate-500">顯示第 <span class="font-medium text-slate-700">1</span> 到 <span class="font-medium text-slate-700">1</span> 筆，共 <span class="font-medium text-slate-700">1</span> 筆</div>
                            <div class="space-x-1">
                                <button class="px-3 py-1 border border-slate-300 rounded bg-white text-slate-500 hover:bg-slate-50 disabled:opacity-50 text-sm">上一頁</button>
                                <button class="px-3 py-1 border border-slate-300 rounded bg-white text-slate-500 hover:bg-slate-50 disabled:opacity-50 text-sm">下一頁</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 系統設定區 (僅管理員可見) -->
                <div id="section-settings" class="hidden max-w-7xl mx-auto">
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex items-center mb-6 pb-4 border-b border-slate-100">
                            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 mr-4">
                                <i class="fa-solid fa-cog"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">系統參數與帳號管理</h2>
                                <p class="text-sm text-slate-500">設定年度、分區資料及管理各層級使用者權限。</p>
                            </div>
                        </div>
                        <div class="p-12 text-center text-slate-400 bg-slate-50 rounded-lg border border-dashed border-slate-200">
                            <i class="fa-solid fa-hammer text-4xl mb-3"></i>
                            <p>設定模組建置中 (依需求可與 Firebase Auth 整合)</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 新增/編輯 派工單彈窗 -->
    <div id="wo-modal" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-50 p-4 sm:p-6">
        <!-- 彈窗卡片: 固定標題與底部，內容區可滾動 -->
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl flex flex-col max-h-full overflow-hidden transform transition-all">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 shrink-0">
                <h2 id="modal-title" class="text-xl font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-file-lines text-blue-600 mr-2"></i> <span>新增派工單</span>
                </h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 hover:bg-slate-200 p-2 rounded-full transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body (可滾動) -->
            <div class="p-6 overflow-y-auto flex-1">
                <form id="wo-form" onsubmit="event.preventDefault(); saveWorkOrder();">
                    
                    <!-- 1. 基本設定 -->
                    <h3 class="section-title"><i class="fa-solid fa-folder-open text-slate-400 mr-2 w-5"></i>基本設定</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                        <div>
                            <label class="form-label">年度</label>
                            <select id="f-year" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" required>
                                <option value="113">113年度</option>
                                <option value="114">114年度</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">分區</label>
                            <select id="f-zone" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" onchange="updateDistrict()" required>
                                <option value="一區">一區 (桃園, 蘆竹)</option>
                                <option value="二區">二區 (八德, 龜山)</option>
                                <option value="三區">三區 (中壢, 大溪, 大園, 復興)</option>
                                <option value="四區">四區 (平鎮, 觀音, 新屋, 龍潭, 楊梅)</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">施工廠商</label>
                            <input type="text" id="f-vendor" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 bg-slate-100 text-slate-500 cursor-not-allowed text-sm" readonly placeholder="系統自動帶入">
                        </div>
                    </div>

                    <!-- 2. 動態編號區 (特別突顯) -->
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-5 mb-8">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
                            <div>
                                <label class="form-label text-blue-900">派工單位</label>
                                <select id="f-unit" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" onchange="generatePrefix()" required>
                                    <option value="工">交工科</option><option value="停">停管科</option><option value="公">公運科</option><option value="安">交安科</option><option value="規">運規科</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label text-blue-900">派別</label>
                                <input type="number" id="f-dispatch-num" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" min="1" value="1" onchange="generatePrefix()" required>
                            </div>
                            <div>
                                <label class="form-label text-blue-900">行政區</label>
                                <select id="f-district" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" onchange="generatePrefix()" required></select>
                            </div>
                            <div>
                                <label class="form-label text-blue-900">派工單編號</label>
                                <div class="flex shadow-sm rounded-md">
                                    <input type="text" id="f-prefix" class="w-16 border border-slate-300 border-r-0 rounded-l-md bg-blue-100 text-blue-800 text-center font-bold text-sm focus:outline-none" readonly placeholder="字首">
                                    <input type="text" id="f-serial" class="flex-1 border border-slate-300 rounded-r-md py-2 px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="流水號 (廠商填)">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 時程資訊 -->
                    <h3 class="section-title"><i class="fa-solid fa-calendar-days text-slate-400 mr-2 w-5"></i>時程資訊</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                        <div><label class="form-label">收單日期</label><input type="date" id="f-receive-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><label class="form-label">派工日期</label><input type="date" id="f-dispatch-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><label class="form-label">指定完成日期</label><input type="date" id="f-designated-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><label class="form-label">預計完工日期</label><input type="date" id="f-est-comp-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><label class="form-label">施作日期</label><input type="date" id="f-construction-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        <div><label class="form-label">實際完工日期</label><input type="date" id="f-actual-comp-date" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                    </div>
                    
                    <!-- 4. 派工細節 -->
                    <h3 class="section-title"><i class="fa-solid fa-list-check text-slate-400 mr-2 w-5"></i>派工細節</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
                        <div><label class="form-label">派工人員</label><input type="text" id="f-personnel" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm"></div>
                        
                        <!-- 案件來源與連動 -->
                        <div class="col-span-1 md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="form-label">案件來源</label>
                                <select id="f-source" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm" onchange="toggleSourceDetails()">
                                    <option value="一般派工">一般派工</option>
                                    <option value="市政信箱">市政信箱</option>
                                    <option value="議員">議員</option>
                                    <option value="里長">里長</option>
                                    <option value="A1">A1</option>
                                    <option value="A2">A2</option>
                                    <option value="緊急派工">緊急派工</option>
                                </select>
                            </div>
                            <div id="div-councilor" class="hidden">
                                <label class="form-label text-blue-700">議員服務處 / 里長辦公處</label>
                                <input type="text" id="f-councilor" class="w-full border border-blue-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 bg-blue-50 text-sm" placeholder="請輸入名稱">
                            </div>
                        </div>

                        <!-- 派工特性 -->
                        <div>
                            <label class="form-label">派工特性</label>
                            <select id="f-characteristics" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="">請選擇</option>
                                <option value="號誌化路口">號誌化路口</option>
                                <option value="非號誌化路口">非號誌化路口</option>
                                <option value="屬路段改善">屬路段改善</option>
                            </select>
                        </div>

                        <!-- 學校周邊與連動 -->
                        <div class="col-span-1 md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label class="form-label">學校周邊</label>
                                <select id="f-school-near" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm" onchange="toggleSchoolDetails()">
                                    <option value="否">否</option>
                                    <option value="是">是</option>
                                </select>
                            </div>
                            <div id="div-school" class="hidden">
                                <label class="form-label text-blue-700">學校名稱</label>
                                <input type="text" id="f-school-name" class="w-full border border-blue-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 bg-blue-50 text-sm" placeholder="請輸入學校名稱">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                        <div>
                            <label class="form-label text-slate-800 font-bold">派工地點</label>
                            <input type="text" id="f-location" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm" required placeholder="如：桃園區中正路與復興路口">
                        </div>
                        <div>
                            <label class="form-label text-slate-800 font-bold">派工內容</label>
                            <input type="text" id="f-content" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm" required placeholder="如：補繪斑馬線、增設標誌">
                        </div>
                    </div>

                    <!-- 5. 金額與附件 -->
                    <h3 class="section-title"><i class="fa-solid fa-paperclip text-slate-400 mr-2 w-5"></i>金額、備註與附件</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <div>
                            <label class="form-label">派工金額 (元)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-400">$</span>
                                <input type="number" id="f-dispatch-amt" class="w-full pl-8 border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="form-label">竣工金額 (元)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2 text-slate-400">$</span>
                                <input type="number" id="f-completion-amt" class="w-full pl-8 border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label">備註</label>
                        <textarea id="f-remarks" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm h-16 resize-none" placeholder="其他補充說明..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="form-label">派工單 (雲端連結)</label>
                            <textarea id="f-doc-links" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm h-20 resize-none font-mono text-xs" placeholder="貼上 Google Drive 連結，可多行..."></textarea>
                        </div>
                        <div>
                            <label class="form-label">完工照片 (雲端連結)</label>
                            <textarea id="f-photo-links" class="w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-2 focus:ring-blue-500 text-sm h-20 resize-none font-mono text-xs" placeholder="貼上 Google Drive 連結，可多行..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            
            <!-- Modal Footer (固定於底部) -->
            <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3 shrink-0">
                <button type="button" onclick="closeModal()" class="px-5 py-2 border border-slate-300 rounded-lg text-slate-700 bg-white hover:bg-slate-50 shadow-sm transition-colors text-sm font-medium">取消</button>
                <button type="submit" form="wo-form" id="btn-save" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all text-sm font-medium">
                    <i class="fa-solid fa-check mr-1"></i> 儲存資料
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Dialog for Alert/Confirm -->
    <div id="custom-dialog" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[60] p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center transform transition-all scale-100">
            <div id="dialog-icon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4">
                <!-- 透過 JS 動態切換圖示 -->
            </div>
            <h3 id="dialog-title" class="text-lg leading-6 font-medium text-slate-900 mb-2">提示</h3>
            <p id="dialog-msg" class="text-sm text-slate-500 mb-6"></p>
            <div class="flex justify-center space-x-3">
                <button id="dialog-btn-cancel" class="px-4 py-2 border border-slate-300 bg-white text-slate-700 rounded-lg hover:bg-slate-50 text-sm font-medium hidden transition-colors w-full">取消</button>
                <button id="dialog-btn-ok" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors w-full shadow-sm">確定</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (模組化引入) 與 頁面邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1MgDq_3voZkYV9ui4KD9bc1-4TJNIE88",
            authDomain: "dispatch-work-order.firebaseapp.com",
            projectId: "dispatch-work-order",
            storageBucket: "dispatch-work-order.firebasestorage.app",
            messagingSenderId: "904528914560",
            appId: "1:904528914560:web:5ff342161da80c54ac5e65"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.currentRole = '';
        window.workOrders = [];

        // 升級版自訂彈窗
        window.showDialog = (type, title, msg, onConfirm = null) => {
            const dialog = document.getElementById('custom-dialog');
            const iconDiv = document.getElementById('dialog-icon');
            const titleEl = document.getElementById('dialog-title');
            const cancelBtn = document.getElementById('dialog-btn-cancel');
            const okBtn = document.getElementById('dialog-btn-ok');
            
            titleEl.innerText = title;
            document.getElementById('dialog-msg').innerText = msg;
            
            if (type === 'success') {
                iconDiv.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 text-green-600 mb-4';
                iconDiv.innerHTML = '<i class="fa-solid fa-check text-xl"></i>';
                okBtn.className = 'px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium transition-colors w-full shadow-sm';
            } else if (type === 'warning' || type === 'confirm') {
                iconDiv.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-amber-100 text-amber-600 mb-4';
                iconDiv.innerHTML = '<i class="fa-solid fa-exclamation text-xl"></i>';
                okBtn.className = type === 'confirm' 
                    ? 'px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium transition-colors w-full shadow-sm'
                    : 'px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors w-full shadow-sm';
            }
            
            if (type === 'confirm') {
                cancelBtn.classList.remove('hidden');
                cancelBtn.onclick = () => { dialog.classList.add('hidden'); dialog.classList.remove('flex'); };
                okBtn.onclick = () => { dialog.classList.add('hidden'); dialog.classList.remove('flex'); if(onConfirm) onConfirm(); };
            } else {
                cancelBtn.classList.add('hidden');
                okBtn.onclick = () => { dialog.classList.add('hidden'); dialog.classList.remove('flex'); if(onConfirm) onConfirm(); };
            }
            
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
        };

        window.customAlert = (msg) => window.showDialog('success', '系統提示', msg);
        window.customConfirm = (msg, onConfirm) => window.showDialog('confirm', '確認操作', msg, onConfirm);

        // 登入邏輯
        window.login = () => {
            const role = document.getElementById('login-user').value;
            const roleText = document.getElementById('login-user').options[document.getElementById('login-user').selectedIndex].text;
            window.currentRole = role;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            document.getElementById('current-role').innerText = roleText.split(' ')[0];
            
            // 權限控制
            if(role === 'admin') document.getElementById('menu-settings-group').classList.remove('hidden');
            if(role !== 'owner') document.getElementById('btn-add-wo').classList.remove('hidden');
            
            const isVendor = (role === 'vendor1');
            const serialInput = document.getElementById('f-serial');
            serialInput.readOnly = !isVendor;
            if(!isVendor) {
                serialInput.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                serialInput.classList.remove('focus:ring-2', 'focus:ring-blue-500');
            }
            
            fetchData();
        };

        window.logout = () => {
            window.currentRole = '';
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('menu-settings-group').classList.add('hidden');
            document.getElementById('btn-add-wo').classList.add('hidden');
        };

        window.showSection = (sectionId) => {
            document.getElementById('section-work-orders').classList.add('hidden');
            document.getElementById('section-settings').classList.add('hidden');
            document.getElementById('section-' + sectionId).classList.remove('hidden');
            
            document.getElementById('header-title').innerText = sectionId === 'work-orders' ? '派工單總表' : '系統與帳號設定';
        };

        // 假資料與表格渲染
        function fetchData() {
            window.workOrders = [
                { id: '1', year: '113', zone: '一區', location: '桃園區中正路1號', content: '標線重劃', prefix: '工01-桃', serial: '001', receiveDate: '2024-05-01', status: '施工中' },
                { id: '2', year: '113', zone: '二區', location: '八德區介壽路一段', content: '增設禁止停車標誌', prefix: '交02-德', serial: '005', receiveDate: '2024-05-10', status: '待派工' }
            ];
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('wo-table-body');
            tbody.innerHTML = '';
            window.workOrders.forEach(wo => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group";
                
                const actionBtns = window.currentRole === 'owner' 
                    ? `<button class="text-blue-600 hover:text-blue-900 bg-blue-50 p-2 rounded-lg tooltip" onclick="openModal('view', '${wo.id}')" title="瀏覽"><i class="fa-solid fa-eye"></i></button>`
                    : `<div class="flex justify-end space-x-2">
                           <button class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-md transition-colors" onclick="openModal('edit', '${wo.id}')" title="編輯"><i class="fa-solid fa-pen"></i></button>
                           <button class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 p-2 rounded-md transition-colors" onclick="deleteWorkOrder('${wo.id}')" title="刪除"><i class="fa-solid fa-trash"></i></button>
                       </div>`;

                const statusColor = wo.status === '施工中' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-100 text-slate-600 border-slate-200';

                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-800 whitespace-nowrap">${wo.prefix}-${wo.serial}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                            ${wo.year} / ${wo.zone}
                        </span>
                    </td>
                    <td class="p-4 text-slate-600 truncate max-w-xs" title="${wo.content}">${wo.content}</td>
                    <td class="p-4 text-slate-500">${wo.receiveDate}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${statusColor}">
                            ${wo.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">${actionBtns}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 動態連動邏輯
        const districtMap = {
            '一區': ['桃園區', '蘆竹區'],
            '二區': ['八德區', '龜山區'],
            '三區': ['中壢區', '大溪區', '大園區', '復興區'],
            '四區': ['平鎮區', '觀音區', '新屋區', '龍潭區', '楊梅區']
        };
        const distCodeMap = {
            '桃園區': '桃', '蘆竹區': '竹', '龜山區': '龜', '八德區': '德',
            '中壢區': '中', '大園區': '園', '大溪區': '溪', '復興區': '復',
            '新屋區': '新', '龍潭區': '龍', '平鎮區': '平', '楊梅區': '楊', '觀音區': '觀'
        };

        window.updateDistrict = () => {
            const zone = document.getElementById('f-zone').value;
            const distSelect = document.getElementById('f-district');
            distSelect.innerHTML = '';
            (districtMap[zone] || []).forEach(d => {
                distSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
            window.generatePrefix();
        };

        window.generatePrefix = () => {
            const unit = document.getElementById('f-unit').value || '工';
            let num = document.getElementById('f-dispatch-num').value || '1';
            num = num.padStart(2, '0');
            const dist = document.getElementById('f-district').value;
            const code = distCodeMap[dist] || '未知';
            
            document.getElementById('f-prefix').value = `${unit}${num}-${code}`;
        };

        window.toggleSourceDetails = () => {
            const src = document.getElementById('f-source').value;
            const div = document.getElementById('div-councilor');
            if(src === '議員' || src === '里長') {
                div.classList.remove('hidden');
                div.querySelector('label').innerText = src === '議員' ? '議員服務處' : '里長辦公處';
            } else {
                div.classList.add('hidden');
            }
        };

        window.toggleSchoolDetails = () => {
            const isNearSchool = document.getElementById('f-school-near').value;
            document.getElementById('div-school').classList.toggle('hidden', isNearSchool !== '是');
        };

        // Modal 操作
        window.openModal = (mode, id = null) => {
            const modal = document.getElementById('wo-modal');
            modal.classList.add('active');
            window.updateDistrict(); 
            
            const isViewOnly = (mode === 'view' || window.currentRole === 'owner');
            document.getElementById('btn-save').style.display = isViewOnly ? 'none' : 'flex';
            document.getElementById('modal-title').innerHTML = isViewOnly 
                ? '<i class="fa-solid fa-file-lines text-slate-500 mr-2"></i> <span>瀏覽派工單</span>'
                : (mode === 'edit' 
                    ? '<i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> <span>編輯派工單</span>' 
                    : '<i class="fa-solid fa-file-circle-plus text-blue-600 mr-2"></i> <span>新增派工單</span>');
            
            const formEls = document.getElementById('wo-form').elements;
            for(let el of formEls) {
                if(el.id !== 'btn-save' && el.tagName !== 'BUTTON') {
                    if (isViewOnly) {
                        el.setAttribute('disabled', 'true');
                        el.classList.add('bg-slate-50', 'text-slate-500');
                    } else {
                        el.removeAttribute('disabled');
                        el.classList.remove('bg-slate-50', 'text-slate-500');
                    }
                }
            }
        };

        window.closeModal = () => {
            document.getElementById('wo-modal').classList.remove('active');
            setTimeout(() => { document.getElementById('wo-form').reset(); }, 300); // 等待動畫結束後清空
        };

        window.saveWorkOrder = () => {
            window.customAlert("派工單資料已成功儲存！");
            window.closeModal();
            fetchData();
        };

        window.deleteWorkOrder = (id) => {
            window.customConfirm("確定要刪除這筆派工單嗎？此操作無法復原。", () => {
                window.showDialog('success', '刪除成功', '該筆派工單已被移除。');
                fetchData();
            });
        };

    </script>
</body>
</html>
