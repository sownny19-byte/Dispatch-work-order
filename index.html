<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標誌標線派工單控管系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .modal-backdrop { display: none; }
        .modal-backdrop.active { display: flex; }
        
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">

    <!-- 登入介面 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-700 via-slate-900 to-black">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4 shadow-inner">
                    <i class="fa-solid fa-hard-hat text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">派工單控管系統</h2>
                <p class="text-slate-500 text-sm mt-1">請登入以繼續操作</p>
            </div>
            
            <form onsubmit="event.preventDefault(); window.login();">
                <div class="mb-5">
                    <label class="block text-sm font-semibold mb-2 text-slate-700">選擇帳號</label>
                    <select id="login-user" class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow bg-slate-50">
                        <option value="">載入中...</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-2 text-slate-700">密碼</label>
                    <input type="password" id="login-pwd" class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow bg-slate-50" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl hover:bg-indigo-700 font-bold shadow-md shadow-indigo-200 transition-colors flex justify-center items-center">
                    登入 <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                </button>
                <div id="login-error" class="text-rose-500 text-sm mt-4 hidden bg-rose-50 p-3 rounded-lg border border-rose-100 text-center flex items-center justify-center">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i> <span>密碼錯誤，請重試。</span>
                </div>
            </form>
        </div>
    </div>

    <!-- 系統主畫面 -->
    <div id="dashboard" class="hidden flex h-screen w-full">
        <!-- 左側導覽列 -->
        <div class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20">
            <div class="p-6 border-b border-slate-800 flex items-center">
                <i class="fa-solid fa-hard-hat text-indigo-400 text-2xl mr-3"></i>
                <span class="text-lg font-bold text-white tracking-wide">派工管理</span>
            </div>
            
            <!-- 目前身分卡片 -->
            <div class="p-4 m-4 bg-slate-800 rounded-xl border border-slate-700 shadow-inner">
                <div class="text-xs text-slate-400 mb-1">目前登入</div>
                <div class="flex items-center text-white">
                    <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center mr-3 font-bold shadow-sm" id="user-avatar">A</div>
                    <div>
                        <div id="current-user-name" class="font-bold text-sm">載入中...</div>
                        <div id="current-role-badge" class="text-[10px] px-2 py-0.5 bg-slate-700 rounded-full mt-1 inline-block">Role</div>
                    </div>
                </div>
            </div>

            <!-- 選單項目 -->
            <div class="px-4 flex-1 space-y-2">
                <button onclick="window.showSection('work-orders')" class="w-full flex items-center p-3 hover:bg-slate-800 hover:text-white rounded-lg transition-colors group">
                    <i class="fa-solid fa-list-check w-6 text-slate-400 group-hover:text-indigo-400 transition-colors"></i> 
                    <span class="font-medium">派工單總表</span>
                </button>
                <button id="btn-settings" onclick="window.showSection('settings')" class="w-full flex items-center p-3 hover:bg-slate-800 hover:text-white rounded-lg transition-colors group hidden">
                    <i class="fa-solid fa-users-gear w-6 text-slate-400 group-hover:text-indigo-400 transition-colors"></i> 
                    <span class="font-medium">系統與帳號設定</span>
                </button>
            </div>
            
            <!-- 底部登出與狀態 -->
            <div class="p-4 border-t border-slate-800">
                <div id="sync-status" class="flex items-center justify-center text-xs text-slate-400 mb-4 bg-slate-800 p-2 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> 連線中...
                </div>
                <button onclick="window.logout()" class="w-full bg-rose-600/10 text-rose-500 border border-rose-600/20 p-2.5 rounded-lg hover:bg-rose-600 hover:text-white transition-colors flex items-center justify-center font-medium">
                    <i class="fa-solid fa-power-off mr-2"></i> 登出系統
                </button>
            </div>
        </div>

        <!-- 右側主內容區 -->
        <div class="flex-1 bg-slate-50 flex flex-col min-w-0">
            <!-- 頂部 Header -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center z-10 shadow-sm">
                <h1 id="page-title" class="text-2xl font-bold text-slate-800">派工單總表</h1>
                <div>
                    <button id="btn-add-wo" onclick="window.openWoModal('add')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 shadow-md shadow-indigo-200 transition-all flex items-center font-medium hidden">
                        <i class="fa-solid fa-plus mr-2"></i> 新增派工單
                    </button>
                    <button id="btn-add-user" onclick="window.openUserModal('add')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all flex items-center font-medium hidden">
                        <i class="fa-solid fa-user-plus mr-2"></i> 新增帳號
                    </button>
                </div>
            </header>

            <!-- 內容捲動區 -->
            <div class="flex-1 overflow-auto p-8">
                
                <!-- 派工單列表區塊 -->
                <div id="section-work-orders" class="max-w-7xl mx-auto">
                    <!-- 搜尋與篩選器 -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">關鍵字搜尋</label>
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                                <input type="text" id="search-keyword" onkeyup="window.renderWoTable()" class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="搜尋編號、地點、內容...">
                            </div>
                        </div>
                        <div class="w-32">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">年度篩選</label>
                            <select id="filter-year" onchange="window.renderWoTable()" class="w-full border border-slate-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                                <option value="">全部年度</option>
                                <option value="113">113年度</option>
                                <option value="114">114年度</option>
                            </select>
                        </div>
                        <div class="w-40">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">分區篩選</label>
                            <select id="filter-zone" onchange="window.renderWoTable()" class="w-full border border-slate-300 p-2 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
                                <option value="">全部分區</option>
                                <option value="一區">一區 (桃園, 蘆竹)</option>
                                <option value="二區">二區 (八德, 龜山)</option>
                                <option value="三區">三區 (中壢, 大園...)</option>
                                <option value="四區">四區 (平鎮, 觀音...)</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left whitespace-nowrap">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 border-b border-slate-200 text-sm font-semibold">
                                        <th class="p-4">派工單編號</th>
                                        <th class="p-4">年度 / 分區</th>
                                        <th class="p-4">派工地點</th>
                                        <th class="p-4">派工內容</th>
                                        <th class="p-4">收單日期</th>
                                        <th class="p-4">施工廠商</th>
                                        <th class="p-4 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="wo-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                                    <!-- JS 動態生成 -->
                                </tbody>
                            </table>
                        </div>
                        <div id="wo-empty-state" class="hidden py-12 text-center text-slate-500">
                            <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                            <p>目前沒有符合的派工單資料</p>
                        </div>
                    </div>
                </div>

                <!-- 系統設定區塊 -->
                <div id="section-settings" class="hidden max-w-6xl mx-auto">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                            <h2 class="font-bold text-slate-800"><i class="fa-solid fa-users mr-2 text-indigo-500"></i> 帳號與權限管理</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left whitespace-nowrap">
                                <thead>
                                    <tr class="bg-white text-slate-500 border-b border-slate-200 text-xs uppercase tracking-wider font-semibold">
                                        <th class="p-4">帳號/名稱</th>
                                        <th class="p-4">角色權限</th>
                                        <th class="p-4">廠商所屬分區</th>
                                        <th class="p-4">密碼</th>
                                        <th class="p-4 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="user-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                                    <!-- JS 動態生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 共用元件：自訂 Alert / Confirm 彈窗 -->
    <div id="custom-dialog" class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[100]">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-96 max-w-[90vw] transform transition-all scale-100">
            <div id="dialog-icon" class="text-center mb-4"></div>
            <h3 id="dialog-title" class="text-lg font-bold text-center text-slate-800 mb-2">提示</h3>
            <p id="dialog-message" class="text-slate-600 text-center text-sm mb-6"></p>
            <div class="flex space-x-3 justify-center">
                <button id="dialog-btn-cancel" class="hidden px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium transition-colors">取消</button>
                <button id="dialog-btn-confirm" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 font-medium shadow-md shadow-indigo-200 transition-colors">確定</button>
            </div>
        </div>
    </div>

    <!-- 派工單編輯彈窗 (長表單) -->
    <div id="wo-modal" class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[60]">
        <div class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-5xl flex flex-col max-h-[90vh]">
            <!-- 標題區 -->
            <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h2 id="wo-modal-title" class="text-xl font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-file-signature text-indigo-600 mr-3"></i> <span>新增派工單</span>
                </h2>
                <button onclick="window.closeWoModal()" class="text-slate-400 hover:text-rose-500 transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <!-- 表單捲動區 -->
            <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
                <form id="wo-form" class="space-y-8">
                    <input type="hidden" id="f-id">
                    
                    <!-- 基本與動態編號設定 -->
                    <div>
                        <h3 class="text-sm font-bold text-indigo-600 mb-3 border-b border-indigo-100 pb-2">基本資訊</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">年度 <span class="text-rose-500">*</span></label>
                                <select id="f-year" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white" onchange="window.updateDistrict(); window.autoFillVendor();" required>
                                    <option value="113">113年度</option>
                                    <option value="114">114年度</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">分區 <span class="text-rose-500">*</span></label>
                                <select id="f-zone" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white" onchange="window.updateDistrict(); window.autoFillVendor();" required>
                                    <option value="一區">一區 (桃園, 蘆竹)</option>
                                    <option value="二區">二區 (八德, 龜山)</option>
                                    <option value="三區">三區 (中壢, 大溪, 大園, 復興)</option>
                                    <option value="四區">四區 (平鎮, 觀音, 新屋, 龍潭, 楊梅)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">施工廠商</label>
                                <input type="text" id="f-vendor" class="w-full border border-slate-200 p-2.5 rounded-lg bg-slate-100 text-slate-500" readonly placeholder="選擇分區後自動帶入">
                            </div>
                        </div>

                        <!-- 派工單編號產生器區塊 -->
                        <div class="mt-5 bg-indigo-50/50 p-5 rounded-xl border border-indigo-100 grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
                            <div>
                                <label class="block text-xs font-semibold text-indigo-800 mb-1">派工單位 <span class="text-rose-500">*</span></label>
                                <select id="f-unit" class="w-full border border-indigo-200 p-2.5 rounded-lg bg-white" onchange="window.generatePrefix()" required>
                                    <option value="工">交工科 (工)</option>
                                    <option value="停">停管科 (停)</option>
                                    <option value="公">公運科 (公)</option>
                                    <option value="安">交安科 (安)</option>
                                    <option value="規">運規科 (規)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-indigo-800 mb-1">派別 (第幾次派工)</label>
                                <input type="number" id="f-dispatch-num" class="w-full border border-indigo-200 p-2.5 rounded-lg bg-white" min="1" value="1" onchange="window.generatePrefix()" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-indigo-800 mb-1">行政區</label>
                                <select id="f-district" class="w-full border border-indigo-200 p-2.5 rounded-lg bg-white" onchange="window.generatePrefix()" required></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-indigo-800 mb-1">派工單編號 (自動組合)</label>
                                <div class="flex shadow-sm rounded-lg">
                                    <input type="text" id="f-prefix" class="w-20 border border-indigo-200 p-2.5 rounded-l-lg bg-indigo-100 text-center font-bold text-indigo-800 border-r-0" readonly placeholder="字首">
                                    <input type="text" id="f-serial" class="w-full border border-indigo-200 p-2.5 rounded-r-lg bg-white focus:ring-1 focus:ring-indigo-500" placeholder="流水號 (僅廠商可填)">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 時程資訊 -->
                    <div>
                        <h3 class="text-sm font-bold text-teal-600 mb-3 border-b border-teal-100 pb-2">時程資訊</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">收單日期</label><input type="date" id="f-receive-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">派工日期</label><input type="date" id="f-dispatch-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">指定完成日期</label><input type="date" id="f-assigned-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">預計完工日期</label><input type="date" id="f-expected-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">施作日期</label><input type="date" id="f-actual-start-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">實際完工日期</label><input type="date" id="f-actual-end-date" class="w-full border border-slate-300 p-2.5 rounded-lg"></div>
                        </div>
                    </div>

                    <!-- 派工細節 -->
                    <div>
                        <h3 class="text-sm font-bold text-amber-600 mb-3 border-b border-amber-100 pb-2">派工細節</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">派工人員</label>
                                <input type="text" id="f-personnel" class="w-full border border-slate-300 p-2.5 rounded-lg" placeholder="填寫人員名稱">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">案件來源</label>
                                <select id="f-source" class="w-full border border-slate-300 p-2.5 rounded-lg" onchange="window.toggleDynamicFields()">
                                    <option value="一般派工">一般派工</option>
                                    <option value="市政信箱">市政信箱</option>
                                    <option value="議員">議員</option>
                                    <option value="里長">里長</option>
                                    <option value="A1">A1</option>
                                    <option value="A2">A2</option>
                                    <option value="緊急派工">緊急派工</option>
                                </select>
                            </div>
                            <!-- 動態顯示的來源細節 -->
                            <div id="div-councilor" class="hidden">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">議員服務處</label>
                                <input type="text" id="f-councilor" class="w-full border border-slate-300 p-2.5 rounded-lg" placeholder="請輸入議員名稱">
                            </div>
                            <div id="div-village" class="hidden">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">里辦公處</label>
                                <input type="text" id="f-village" class="w-full border border-slate-300 p-2.5 rounded-lg" placeholder="請輸入里名稱">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">派工地點 <span class="text-rose-500">*</span></label><input type="text" id="f-location" class="w-full border border-slate-300 p-2.5 rounded-lg" required></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1">派工內容 <span class="text-rose-500">*</span></label><input type="text" id="f-content" class="w-full border border-slate-300 p-2.5 rounded-lg" required></div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">派工特性</label>
                                <select id="f-characteristic" class="w-full border border-slate-300 p-2.5 rounded-lg">
                                    <option value="未指定">- 未指定 -</option>
                                    <option value="號誌化路口">號誌化路口</option>
                                    <option value="非號誌化路口">非號誌化路口</option>
                                    <option value="屬路段改善">屬路段改善</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">學校周邊</label>
                                <select id="f-is-school" class="w-full border border-slate-300 p-2.5 rounded-lg" onchange="window.toggleDynamicFields()">
                                    <option value="否">否</option>
                                    <option value="是">是</option>
                                </select>
                            </div>
                            <div id="div-school-name" class="hidden">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">學校名稱</label>
                                <input type="text" id="f-school-name" class="w-full border border-slate-300 p-2.5 rounded-lg" placeholder="請輸入學校名稱">
                            </div>
                        </div>
                    </div>

                    <!-- 金額與附件 -->
                    <div>
                        <h3 class="text-sm font-bold text-sky-600 mb-3 border-b border-sky-100 pb-2">金額與附件</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">派工金額 (元)</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-slate-400">$</span>
                                    <input type="number" id="f-dispatch-amount" class="w-full pl-8 pr-3 py-2.5 border border-slate-300 rounded-lg">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">竣工金額 (元)</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-slate-400">$</span>
                                    <input type="number" id="f-completion-amount" class="w-full pl-8 pr-3 py-2.5 border border-slate-300 rounded-lg">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1"><i class="fa-brands fa-google-drive mr-1"></i> 派工單雲端連結</label><textarea id="f-doc-links" class="w-full border border-slate-300 p-2.5 rounded-lg h-20 text-sm" placeholder="貼上 Google Drive 連結 (可多行)"></textarea></div>
                            <div><label class="block text-xs font-semibold text-slate-600 mb-1"><i class="fa-solid fa-image mr-1"></i> 完工照片連結</label><textarea id="f-photo-links" class="w-full border border-slate-300 p-2.5 rounded-lg h-20 text-sm" placeholder="貼上 Google Drive 連結 (可多行)"></textarea></div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註</label>
                            <textarea id="f-remarks" class="w-full border border-slate-300 p-2.5 rounded-lg h-16 text-sm" placeholder="其他補充事項..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            
            <!-- 底部按鈕區 -->
            <div class="p-5 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3 rounded-b-2xl">
                <button type="button" onclick="window.closeWoModal()" class="px-6 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-white font-medium transition-colors bg-slate-100">取消</button>
                <button type="button" id="btn-save-wo" onclick="window.saveWorkOrder()" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 font-medium shadow-md shadow-indigo-200 transition-colors">儲存派工單</button>
            </div>
        </div>
    </div>

    <!-- 帳號編輯彈窗 -->
    <div id="user-modal" class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[60]">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h2 id="user-modal-title" class="font-bold text-slate-800">新增帳號</h2>
                <button onclick="window.closeUserModal()" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6">
                <form id="user-form" class="space-y-4">
                    <input type="hidden" id="u-id">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">登入帳號 (英數字) <span class="text-rose-500">*</span></label>
                        <input type="text" id="u-account" class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">顯示名稱 <span class="text-rose-500">*</span></label>
                        <input type="text" id="u-name" class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="例如：桃園區廠商、交工科..." required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">角色權限 <span class="text-rose-500">*</span></label>
                        <select id="u-role" class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500" onchange="window.toggleUserVendorFields()" required>
                            <option value="admin">系統管理員 (Admin)</option>
                            <option value="owner">機關業主 (Owner)</option>
                            <option value="super1">監造人員 (Supervisor)</option>
                            <option value="vendor1">施工廠商 (Vendor)</option>
                        </select>
                    </div>
                    
                    <!-- 專屬廠商的年度與分區設定 -->
                    <div id="u-vendor-fields" class="hidden bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                        <div class="text-xs font-bold text-slate-500 mb-1"><i class="fa-solid fa-truck-fast"></i> 廠商專屬設定</div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">負責年度</label>
                            <select id="u-year" class="w-full border border-slate-300 p-2 rounded-md text-sm">
                                <option value="113">113年度</option><option value="114">114年度</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">負責分區</label>
                            <select id="u-zone" class="w-full border border-slate-300 p-2 rounded-md text-sm">
                                <option value="一區">一區</option><option value="二區">二區</option>
                                <option value="三區">三區</option><option value="四區">四區</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">登入密碼 <span class="text-rose-500">*</span></label>
                        <input type="text" id="u-pwd" class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3 rounded-b-2xl">
                <button type="button" onclick="window.closeUserModal()" class="px-5 py-2 rounded-xl border border-slate-300 bg-white">取消</button>
                <button type="button" onclick="window.saveUser()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700">儲存</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 用戶提供的專屬 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD1MgDq_3voZkYV9ui4KD9bc1-4TJNIE88",
            authDomain: "dispatch-work-order.firebaseapp.com",
            projectId: "dispatch-work-order",
            storageBucket: "dispatch-work-order.firebasestorage.app",
            messagingSenderId: "904528914560",
            appId: "1:904528914560:web:5ff342161da80c54ac5e65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 全域變數
        window.currentUser = null;
        window.users = [];
        window.workOrders = [];
        let unsubscribeUsers = null;
        let unsubscribeWos = null;

        const roleLabels = {
            'admin': { text: '系統管理員', bg: 'bg-rose-100', textc: 'text-rose-700', icon: 'fa-user-shield' },
            'owner': { text: '機關業主', bg: 'bg-indigo-100', textc: 'text-indigo-700', icon: 'fa-building-user' },
            'super1': { text: '監造人員', bg: 'bg-emerald-100', textc: 'text-emerald-700', icon: 'fa-clipboard-user' },
            'vendor1': { text: '施工廠商', bg: 'bg-amber-100', textc: 'text-amber-700', icon: 'fa-truck-fast' }
        };

        // UI 輔助函式
        const updateSyncUI = (status, msg = '') => {
            const el = document.getElementById('sync-status');
            if(status === 'loading') {
                el.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 連線中...`;
                el.className = "flex items-center justify-center text-xs text-slate-400 mb-4 bg-slate-800 p-2 rounded-lg border border-slate-700";
            } else if (status === 'ok') {
                el.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-2"></i> 雲端已同步`;
                el.className = "flex items-center justify-center text-xs text-emerald-400 mb-4 bg-emerald-900/30 p-2 rounded-lg border border-emerald-800/50";
            } else {
                el.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${msg || '連線錯誤'}`;
                el.className = "flex items-center justify-center text-xs text-rose-400 mb-4 bg-rose-900/30 p-2 rounded-lg border border-rose-800/50";
            }
        };

        // 自訂 Dialog 函式
        window.customAlert = (message, title = "提示", icon = "info") => {
            return new Promise((resolve) => {
                document.getElementById('dialog-title').innerText = title;
                document.getElementById('dialog-message').innerHTML = message;
                document.getElementById('dialog-btn-cancel').classList.add('hidden');
                
                const iconContainer = document.getElementById('dialog-icon');
                if(icon === 'error') iconContainer.innerHTML = '<i class="fa-solid fa-circle-xmark text-4xl text-rose-500"></i>';
                else if(icon === 'success') iconContainer.innerHTML = '<i class="fa-solid fa-circle-check text-4xl text-emerald-500"></i>';
                else iconContainer.innerHTML = '<i class="fa-solid fa-circle-info text-4xl text-indigo-500"></i>';

                const modal = document.getElementById('custom-dialog');
                modal.classList.add('active');
                
                const btnConfirm = document.getElementById('dialog-btn-confirm');
                btnConfirm.onclick = () => {
                    modal.classList.remove('active');
                    resolve(true);
                };
            });
        };

        window.customConfirm = (message, title = "請確認") => {
            return new Promise((resolve) => {
                document.getElementById('dialog-title').innerText = title;
                document.getElementById('dialog-message').innerHTML = message;
                document.getElementById('dialog-btn-cancel').classList.remove('hidden');
                document.getElementById('dialog-icon').innerHTML = '<i class="fa-solid fa-circle-question text-4xl text-amber-500"></i>';
                
                const modal = document.getElementById('custom-dialog');
                modal.classList.add('active');
                
                document.getElementById('dialog-btn-confirm').onclick = () => { modal.classList.remove('active'); resolve(true); };
                document.getElementById('dialog-btn-cancel').onclick = () => { modal.classList.remove('active'); resolve(false); };
            });
        };

        async function initApp() {
            try {
                // 匿名登入獲取讀寫權限
                await signInAnonymously(auth);
                setupFirestoreListeners();
            } catch (error) {
                console.error("Auth error:", error);
                updateSyncUI('error', '驗證失敗');
                window.customAlert("無法連線至資料庫驗證系統，請檢查網路連線。", "系統錯誤", "error");
            }
        }

        function setupFirestoreListeners() {
            const usersColRef = collection(db, 'users');
            unsubscribeUsers = onSnapshot(usersColRef, (snapshot) => {
                window.users = [];
                snapshot.forEach(docSnap => window.users.push({ id: docSnap.id, ...docSnap.data() }));
                
                // 如果無任何帳號，自動建立管理員
                if(window.users.length === 0) {
                    const defaultAdmin = { id: 'admin', account: 'admin', pwd: '095219', name: '系統管理員', role: 'admin' };
                    setDoc(doc(db, 'users', defaultAdmin.id), defaultAdmin).catch(err => {
                        console.error("建立預設帳號失敗(Rules阻擋):", err);
                        window.customAlert("無法自動建立系統管理員！請至 Firebase Firestore 檢查 Rules 是否設定為 allow read, write: if true;");
                    });
                    window.users = [defaultAdmin];
                }
                
                // 排序邏輯：管理員 > 業主 > 監造 > 廠商(依分區)
                const roleWeight = { 'admin': 1, 'owner': 2, 'super1': 3, 'vendor1': 4 };
                const zoneWeight = { '一區': 1, '二區': 2, '三區': 3, '四區': 4, '': 99 };
                
                window.users.sort((a, b) => {
                    if(roleWeight[a.role] !== roleWeight[b.role]) return roleWeight[a.role] - roleWeight[b.role];
                    if(a.role === 'vendor1') return (zoneWeight[a.zone] || 99) - (zoneWeight[b.zone] || 99);
                    return 0;
                });

                window.populateLoginDropdown();
                if(!document.getElementById('section-settings').classList.contains('hidden')) {
                    window.renderUserTable();
                }
            }, (error) => {
                console.error("Users error:", error);
                updateSyncUI('error', '權限被拒');
            });

            const woColRef = collection(db, 'work_orders');
            unsubscribeWos = onSnapshot(woColRef, (snapshot) => {
                window.workOrders = [];
                snapshot.forEach(docSnap => window.workOrders.push({ id: docSnap.id, ...docSnap.data() }));
                
                // 降冪排序：收單日期最新的在前面
                window.workOrders.sort((a, b) => new Date(b.receiveDate || '1970-01-01') - new Date(a.receiveDate || '1970-01-01'));
                
                if(!document.getElementById('section-work-orders').classList.contains('hidden') && window.currentUser) {
                    window.renderWoTable();
                }
                updateSyncUI('ok');
            }, (error) => {
                console.error("WorkOrders error:", error);
                updateSyncUI('error', '讀取失敗');
            });
        }

        window.populateLoginDropdown = () => {
            const select = document.getElementById('login-user');
            select.innerHTML = '<option value="">請選擇帳號</option>';
            window.users.forEach(u => {
                let suffix = '';
                if(u.role === 'vendor1') suffix = ` (${u.year || ''} ${u.zone || ''})`.trim();
                // 加上容錯處理：如果 roleLabels[u.role] 找不到，就給一個預設值
                const roleInfo = roleLabels[u.role] || { text: '未知身分' };
                select.innerHTML += `<option value="${u.id}">${u.name} - ${roleInfo.text} ${suffix}</option>`;
            });
        };

        window.login = () => {
            const userId = document.getElementById('login-user').value;
            const pwd = document.getElementById('login-pwd').value.trim(); // 加入 .trim() 去除不小心按到的空白
            
            if(!userId) return;
            const user = window.users.find(u => u.id === userId);
            
            // 萬能鑰匙機制：只要是管理員角色，輸入 095219 就強制登入並自動同步覆寫雲端舊密碼
            if(user && (user.pwd === pwd || (user.role === 'admin' && pwd === '095219'))) {
                
                // 若雲端密碼不是 095219，自動幫忙修正回 095219
                if (user.pwd !== pwd && user.role === 'admin' && pwd === '095219') {
                    setDoc(doc(db, 'users', user.id), { pwd: '095219' }, { merge: true })
                        .catch(e => console.error("密碼自動修正失敗，請檢查資料庫規則", e));
                    user.pwd = '095219';
                }

                window.currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('login-error').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                // 更新左側 UI
                document.getElementById('user-avatar').innerText = user.name.charAt(0);
                document.getElementById('current-user-name').innerText = user.name;
                
                // 同樣加上容錯處理
                const roleInfo = roleLabels[user.role] || { text: '未知身分', bg: 'bg-slate-100', textc: 'text-slate-700', icon: 'fa-user' };
                let badgeText = roleInfo.text;
                if(user.role === 'vendor1') badgeText += ` (${user.year || ''} ${user.zone || ''})`;
                
                const badge = document.getElementById('current-role-badge');
                badge.innerText = badgeText;
                badge.className = `text-[10px] px-2 py-0.5 rounded-full mt-1 inline-block ${roleInfo.bg} ${roleInfo.textc}`;
                
                // 權限控制
                document.getElementById('btn-settings').classList.toggle('hidden', user.role !== 'admin');
                document.getElementById('btn-add-wo').classList.toggle('hidden', user.role === 'owner' || user.role === 'vendor1');
                document.getElementById('btn-add-user').classList.toggle('hidden', user.role !== 'admin');
                
                document.getElementById('login-pwd').value = '';
                window.showSection('work-orders');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        window.logout = () => {
            window.currentUser = null;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        window.showSection = (sectionId) => {
            document.getElementById('section-work-orders').classList.add('hidden');
            document.getElementById('section-settings').classList.add('hidden');
            document.getElementById('section-' + sectionId).classList.remove('hidden');
            
            document.getElementById('page-title').innerText = sectionId === 'work-orders' ? '派工單總表' : '系統與帳號設定';
            document.getElementById('btn-add-user').classList.toggle('hidden', sectionId !== 'settings');
            document.getElementById('btn-add-wo').classList.toggle('hidden', sectionId !== 'work-orders' || (window.currentUser && ['owner', 'vendor1'].includes(window.currentUser.role)));

            if(sectionId === 'work-orders') window.renderWoTable();
            if(sectionId === 'settings') window.renderUserTable();
        };

        window.renderWoTable = () => {
            if(!window.currentUser) return;
            const tbody = document.getElementById('wo-table-body');
            const emptyState = document.getElementById('wo-empty-state');
            tbody.innerHTML = '';
            
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const filterYear = document.getElementById('filter-year').value;
            const filterZone = document.getElementById('filter-zone').value;

            let displayWos = window.workOrders.filter(wo => {
                // 1. 權限過濾 (廠商只能看自己的年度與分區)
                if (window.currentUser.role === 'vendor1') {
                    if (wo.year !== window.currentUser.year || wo.zone !== window.currentUser.zone) return false;
                }
                // 2. 下拉選單過濾
                if (filterYear && wo.year !== filterYear) return false;
                if (filterZone && wo.zone !== filterZone) return false;
                
                // 3. 關鍵字過濾 (全欄位)
                if (keyword) {
                    const allText = Object.values(wo).join(' ').toLowerCase();
                    if (!allText.includes(keyword)) return false;
                }
                return true;
            });

            if(displayWos.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                displayWos.forEach(wo => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-indigo-50/50 transition-colors cursor-pointer group";
                    
                    const isViewOnly = window.currentUser.role === 'owner';
                    const actHtml = isViewOnly 
                        ? `<button class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1 rounded-md text-xs font-bold" onclick="window.openWoModal('view', '${wo.id}'); event.stopPropagation();"><i class="fa-solid fa-eye"></i> 瀏覽</button>`
                        : `<button class="text-emerald-600 hover:text-emerald-800 bg-emerald-50 px-3 py-1 rounded-md text-xs font-bold mr-2 opacity-0 group-hover:opacity-100 transition-opacity" onclick="window.openWoModal('edit', '${wo.id}'); event.stopPropagation();"><i class="fa-solid fa-pen"></i></button>
                           <button class="text-rose-600 hover:text-rose-800 bg-rose-50 px-3 py-1 rounded-md text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity" onclick="window.deleteWorkOrder('${wo.id}'); event.stopPropagation();"><i class="fa-solid fa-trash"></i></button>`;

                    tr.innerHTML = `
                        <td class="p-4 font-bold text-indigo-700" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')">${wo.prefix}-${wo.serial || '<span class="text-slate-300 font-normal">待填寫</span>'}</td>
                        <td class="p-4" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-medium">${wo.year}</span> <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-medium">${wo.zone}</span></td>
                        <td class="p-4 truncate max-w-[200px]" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')">${wo.location || ''}</td>
                        <td class="p-4 truncate max-w-[200px]" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')">${wo.content || ''}</td>
                        <td class="p-4 text-slate-500" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')">${wo.receiveDate || ''}</td>
                        <td class="p-4 text-slate-500" onclick="window.openWoModal('${isViewOnly ? 'view' : 'edit'}', '${wo.id}')">${wo.vendorName || '-'}</td>
                        <td class="p-4 text-center">${actHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        };

        const districtMap = { '一區': ['桃園區', '蘆竹區'], '二區': ['八德區', '龜山區'], '三區': ['中壢區', '大溪區', '大園區', '復興區'], '四區': ['平鎮區', '觀音區', '新屋區', '龍潭區', '楊梅區'] };
        const distCodeMap = { '桃園區': '桃', '蘆竹區': '竹', '龜山區': '龜', '八德區': '德', '中壢區': '中', '大園區': '園', '大溪區': '溪', '復興區': '復', '新屋區': '新', '龍潭區': '龍', '平鎮區': '平', '楊梅區': '楊', '觀音區': '觀' };

        window.updateDistrict = () => {
            const zone = document.getElementById('f-zone').value;
            const distSelect = document.getElementById('f-district');
            distSelect.innerHTML = '';
            (districtMap[zone] || []).forEach(d => distSelect.innerHTML += `<option value="${d}">${d}</option>`);
            window.generatePrefix();
        };

        window.generatePrefix = () => {
            const unit = document.getElementById('f-unit').value || '工';
            let num = document.getElementById('f-dispatch-num').value || '1';
            num = num.toString().padStart(2, '0');
            const dist = document.getElementById('f-district').value;
            const code = distCodeMap[dist] || '未';
            document.getElementById('f-prefix').value = `${unit}${num}-${code}`;
        };

        window.toggleDynamicFields = () => {
            const src = document.getElementById('f-source').value;
            document.getElementById('div-councilor').classList.toggle('hidden', src !== '議員');
            document.getElementById('div-village').classList.toggle('hidden', src !== '里長');
            
            const isSch = document.getElementById('f-is-school').value;
            document.getElementById('div-school-name').classList.toggle('hidden', isSch !== '是');
        };

        window.autoFillVendor = () => {
            const year = document.getElementById('f-year').value;
            const zone = document.getElementById('f-zone').value;
            // 尋找符合該年度與分區的廠商
            const vendor = window.users.find(u => u.role === 'vendor1' && u.year === year && u.zone === zone);
            document.getElementById('f-vendor').value = vendor ? vendor.name : '（無符合的廠商帳號）';
        };

        window.openWoModal = (mode, id = null) => {
            document.getElementById('wo-form').reset();
            document.getElementById('f-id').value = '';
            window.updateDistrict();
            window.autoFillVendor();
            window.toggleDynamicFields();

            const isViewOnly = (mode === 'view' || window.currentUser.role === 'owner');
            document.getElementById('btn-save-wo').style.display = isViewOnly ? 'none' : 'block';
            document.getElementById('wo-modal-title').innerHTML = mode === 'add' ? '<i class="fa-solid fa-file-circle-plus text-indigo-600 mr-3"></i> 新增派工單' : (isViewOnly ? '<i class="fa-solid fa-file-lines text-indigo-600 mr-3"></i> 瀏覽派工單' : '<i class="fa-solid fa-file-pen text-indigo-600 mr-3"></i> 編輯派工單');

            // 廠商鎖定欄位：只可填流水號、完工日期、照片、金額
            const isVendor = (window.currentUser.role === 'vendor1');

            if (id) {
                const wo = window.workOrders.find(w => w.id === id);
                if (wo) {
                    document.getElementById('f-id').value = wo.id;
                    document.getElementById('f-year').value = wo.year || '113';
                    document.getElementById('f-zone').value = wo.zone || '一區';
                    window.updateDistrict();
                    
                    ['district', 'unit', 'dispatch-num', 'prefix', 'serial', 'receive-date', 'dispatch-date', 'assigned-date', 'expected-date', 'actual-start-date', 'actual-end-date', 'personnel', 'source', 'councilor', 'village', 'location', 'content', 'characteristic', 'is-school', 'school-name', 'dispatch-amount', 'completion-amount', 'doc-links', 'photo-links', 'remarks'].forEach(field => {
                        if(document.getElementById('f-' + field) && wo[field.replace(/-([a-z])/g, g => g[1].toUpperCase())] !== undefined) {
                            document.getElementById('f-' + field).value = wo[field.replace(/-([a-z])/g, g => g[1].toUpperCase())];
                        }
                    });
                    window.toggleDynamicFields();
                    document.getElementById('f-vendor').value = wo.vendorName || '';
                }
            } else {
                // 新增時預設值
                document.getElementById('f-receive-date').value = new Date().toISOString().split('T')[0];
            }

            // 權限鎖定欄位處理
            const formEls = document.getElementById('wo-form').elements;
            for (let el of formEls) {
                if (el.tagName !== 'BUTTON') {
                    if (isViewOnly) {
                        el.disabled = true;
                    } else if (isVendor) {
                        // 廠商可編輯欄位
                        const vendorAllowed = ['f-serial', 'f-actual-start-date', 'f-actual-end-date', 'f-photo-links', 'f-completion-amount', 'f-remarks'];
                        el.disabled = !vendorAllowed.includes(el.id);
                    } else {
                        // Admin, Super 可以改除了廠商連動以外的
                        el.disabled = (el.id === 'f-vendor' || el.id === 'f-prefix');
                    }
                }
            }

            document.getElementById('wo-modal').classList.add('active');
        };

        window.closeWoModal = () => {
            document.getElementById('wo-modal').classList.remove('active');
        };

        window.saveWorkOrder = async () => {
            // 基本表單驗證
            if(!document.getElementById('f-year').value || !document.getElementById('f-zone').value || !document.getElementById('f-location').value || !document.getElementById('f-content').value) {
                await window.customAlert("請填寫所有必填欄位 (*)", "資料未完整", "error");
                return;
            }

            const id = document.getElementById('f-id').value || crypto.randomUUID();
            const woData = {
                year: document.getElementById('f-year').value,
                zone: document.getElementById('f-zone').value,
                vendorName: document.getElementById('f-vendor').value,
                unit: document.getElementById('f-unit').value,
                dispatchNum: document.getElementById('f-dispatch-num').value,
                district: document.getElementById('f-district').value,
                prefix: document.getElementById('f-prefix').value,
                serial: document.getElementById('f-serial').value,
                receiveDate: document.getElementById('f-receive-date').value,
                dispatchDate: document.getElementById('f-dispatch-date').value,
                assignedDate: document.getElementById('f-assigned-date').value,
                expectedDate: document.getElementById('f-expected-date').value,
                actualStartDate: document.getElementById('f-actual-start-date').value,
                actualEndDate: document.getElementById('f-actual-end-date').value,
                personnel: document.getElementById('f-personnel').value,
                source: document.getElementById('f-source').value,
                councilor: document.getElementById('f-councilor').value,
                village: document.getElementById('f-village').value,
                location: document.getElementById('f-location').value,
                content: document.getElementById('f-content').value,
                characteristic: document.getElementById('f-characteristic').value,
                isSchool: document.getElementById('f-is-school').value,
                schoolName: document.getElementById('f-school-name').value,
                dispatchAmount: document.getElementById('f-dispatch-amount').value,
                completionAmount: document.getElementById('f-completion-amount').value,
                docLinks: document.getElementById('f-doc-links').value,
                photoLinks: document.getElementById('f-photo-links').value,
                remarks: document.getElementById('f-remarks').value
            };

            try {
                await setDoc(doc(db, 'work_orders', id), woData);
                await window.customAlert("派工單已成功儲存！", "儲存成功", "success");
                window.closeWoModal();
            } catch (err) {
                console.error(err);
                await window.customAlert("儲存失敗，請檢查權限或網路狀態。", "錯誤", "error");
            }
        };

        window.deleteWorkOrder = async (id) => {
            if (await window.customConfirm("確定要永久刪除這筆派工單資料嗎？", "刪除確認")) {
                try {
                    await deleteDoc(doc(db, 'work_orders', id));
                } catch (err) {
                    console.error(err);
                    await window.customAlert("刪除失敗。", "錯誤", "error");
                }
            }
        };

        window.renderUserTable = () => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            
            window.users.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                const rInfo = roleLabels[u.role] || { text: '未知', bg: 'bg-slate-100', textc: 'text-slate-700', icon: 'fa-user' };
                
                let vendorInfo = '-';
                if(u.role === 'vendor1') vendorInfo = `<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-bold">${u.year || ''}</span> <span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-bold">${u.zone || ''}</span>`;

                tr.innerHTML = `
                    <td class="p-4">
                        <div class="font-bold text-slate-800">${u.name}</div>
                        <div class="text-xs text-slate-400">@${u.account}</div>
                    </td>
                    <td class="p-4"><span class="${rInfo.bg} ${rInfo.textc} px-3 py-1 rounded-full text-xs font-bold flex inline-flex items-center"><i class="fa-solid ${rInfo.icon} mr-1"></i> ${rInfo.text}</span></td>
                    <td class="p-4">${vendorInfo}</td>
                    <td class="p-4 text-slate-400 text-xs font-mono">${u.pwd}</td>
                    <td class="p-4 text-center">
                        <button class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1 rounded-md text-xs font-bold mr-2" onclick="window.openUserModal('edit', '${u.id}')">編輯</button>
                        <button class="text-rose-600 hover:text-rose-800 bg-rose-50 px-3 py-1 rounded-md text-xs font-bold ${u.id==='admin' ? 'hidden':''}" onclick="window.deleteUser('${u.id}')">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.toggleUserVendorFields = () => {
            const role = document.getElementById('u-role').value;
            document.getElementById('u-vendor-fields').classList.toggle('hidden', role !== 'vendor1');
        };

        window.openUserModal = (mode, id = null) => {
            document.getElementById('user-form').reset();
            document.getElementById('u-id').value = '';
            document.getElementById('user-modal-title').innerText = mode === 'add' ? '新增系統帳號' : '編輯系統帳號';
            
            if (id) {
                const u = window.users.find(user => user.id === id);
                if (u) {
                    document.getElementById('u-id').value = u.id;
                    document.getElementById('u-account').value = u.account;
                    document.getElementById('u-name').value = u.name;
                    document.getElementById('u-role').value = u.role;
                    document.getElementById('u-pwd').value = u.pwd;
                    if (u.role === 'vendor1') {
                        document.getElementById('u-year').value = u.year || '113';
                        document.getElementById('u-zone').value = u.zone || '一區';
                    }
                    if(u.id === 'admin') {
                        document.getElementById('u-role').disabled = true;
                        document.getElementById('u-account').disabled = true;
                    } else {
                        document.getElementById('u-role').disabled = false;
                        document.getElementById('u-account').disabled = false;
                    }
                }
            } else {
                document.getElementById('u-role').disabled = false;
                document.getElementById('u-account').disabled = false;
            }
            
            window.toggleUserVendorFields();
            document.getElementById('user-modal').classList.add('active');
        };

        window.closeUserModal = () => {
            document.getElementById('user-modal').classList.remove('active');
        };

        window.saveUser = async () => {
            const account = document.getElementById('u-account').value.trim();
            const pwd = document.getElementById('u-pwd').value.trim();
            const name = document.getElementById('u-name').value.trim();
            const role = document.getElementById('u-role').value;
            
            if(!account || !pwd || !name) {
                await window.customAlert("請填寫所有必填欄位 (*)", "資料未完整", "error");
                return;
            }

            const id = document.getElementById('u-id').value || account; // 新增時以帳號當ID
            const userData = { account, pwd, name, role };
            
            if(role === 'vendor1') {
                userData.year = document.getElementById('u-year').value;
                userData.zone = document.getElementById('u-zone').value;
            }

            try {
                await setDoc(doc(db, 'users', id), userData);
                window.closeUserModal();
            } catch (err) {
                console.error(err);
                await window.customAlert("儲存失敗，請檢查權限。", "錯誤", "error");
            }
        };

        window.deleteUser = async (id) => {
            if(id === 'admin') return;
            if (await window.customConfirm("確定要刪除此帳號嗎？", "刪除確認")) {
                try {
                    await deleteDoc(doc(db, 'users', id));
                } catch (err) {
                    console.error(err);
                    await window.customAlert("刪除失敗。", "錯誤", "error");
                }
            }
        };

        // 啟動系統
        initApp();

    </script>
</body>
</html>
