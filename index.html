<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>標誌標線派工單控管系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 玻璃擬態 */
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden h-screen w-screen">

    <!-- 登入介面 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 transition-opacity duration-500">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            <div class="absolute top-1/4 right-0 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        </div>
        
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-10 mx-4 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-indigo-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-road text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">交通局派工系統</h2>
                <p class="text-slate-500 text-sm mt-1">v2.0 Beta</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">登入帳號</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <select id="login-user" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all appearance-none cursor-pointer">
                            <option value="">載入中...</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">登入密碼</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-pwd" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="請輸入密碼">
                    </div>
                </div>
                <button onclick="window.login()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 transition-all shadow-md mt-2">
                    登入系統
                </button>
            </div>
        </div>
    </div>

    <!-- 系統主畫面 -->
    <div id="dashboard" class="hidden flex h-screen w-full bg-slate-50 overflow-hidden relative">
        
        <!-- 側邊欄遮罩 (手機版用) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden md:hidden transition-opacity opacity-0" onclick="window.toggleSidebar()"></div>

        <!-- 左側選單 -->
        <div id="sidebar" class="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl absolute md:relative z-[70] md:z-20 h-full transition-transform duration-300 -translate-x-full md:translate-x-0 shrink-0">
            <!-- Logo 區 -->
            <div class="p-6 bg-slate-950/50 flex items-center gap-3">
                <div class="bg-indigo-500 text-white w-10 h-10 rounded-xl flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-road text-xl"></i>
                </div>
                <div>
                    <div class="font-bold text-white tracking-wide">交通局派工系統</div>
                    <div class="text-xs text-indigo-300">v2.0 Beta</div>
                </div>
            </div>
            
            <!-- 使用者資訊 -->
            <div class="p-5 border-b border-slate-800">
                <div class="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">當前登入</div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                        <i class="fa-solid fa-user-tie text-slate-400"></i>
                    </div>
                    <div>
                        <div id="current-user-name" class="text-white font-medium">載入中...</div>
                        <div id="current-role-badge" class="text-xs mt-1 inline-block px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">讀取中</div>
                    </div>
                </div>
            </div>

            <!-- 選單項目 -->
            <div class="p-4 flex-1 overflow-y-auto space-y-2">
                <div class="text-xs font-semibold text-slate-500 mb-2 mt-2 uppercase tracking-wider px-2">主要功能</div>
                <button onclick="window.showSection('work-orders')" id="nav-work-orders" class="w-full text-left px-4 py-3 bg-indigo-600/10 text-indigo-400 hover:bg-slate-800 hover:text-white rounded-xl transition-colors flex items-center gap-3 font-medium">
                    <i class="fa-solid fa-list-check w-5 text-center"></i> 派工單總表
                </button>
                
                <div id="nav-settings-container" class="hidden">
                    <div class="text-xs font-semibold text-slate-500 mb-2 mt-6 uppercase tracking-wider px-2">系統管理</div>
                    <button onclick="window.showSection('settings')" id="nav-settings" class="w-full text-left px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition-colors flex items-center gap-3 text-slate-400 font-medium">
                        <i class="fa-solid fa-sliders w-5 text-center"></i> 系統與帳號設定
                    </button>
                </div>
            </div>
            
            <!-- 底部登出 -->
            <div class="p-5 border-t border-slate-800 bg-slate-950/30">
                <div id="sync-status" class="flex items-center gap-2 text-xs text-emerald-400 mb-4 px-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    資料庫連線中...
                </div>
                <button onclick="window.logout()" class="w-full bg-slate-800/50 border border-slate-700 py-2.5 rounded-xl hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 transition-all text-sm font-medium flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> 登出系統
                </button>
            </div>
        </div>

        <!-- 右側內容區 -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
            
            <!-- 頂部 Header -->
            <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 md:px-8 shrink-0 z-10 shadow-sm w-full">
                <div class="flex items-center gap-3">
                    <!-- 漢堡選單按鈕 (僅手機版顯示) -->
                    <button onclick="window.toggleSidebar()" class="md:hidden w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h2 id="page-title" class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-500"></i> 派工單總表
                    </h2>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-slate-500 hidden md:block" id="current-date-display"></span>
                </div>
            </header>

            <!-- 內容滾動區 -->
            <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50 relative w-full">
                
                <!-- 派工單列表區塊 -->
                <div id="section-work-orders" class="max-w-7xl mx-auto space-y-6">
                    
                    <!-- 搜尋與篩選工具列 -->
                    <div class="glass-panel p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
                            <!-- 全域搜尋 -->
                            <div class="relative w-full md:w-64">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="filter-search" onkeyup="window.renderWoTable()" class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="搜尋編號、地點、內容...">
                            </div>
                            <!-- 年度篩選 -->
                            <select id="filter-year" onchange="window.renderWoTable()" class="w-full md:w-32 px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="">全部年度</option>
                            </select>
                            <!-- 分區篩選 -->
                            <select id="filter-zone" onchange="window.renderWoTable()" class="w-full md:w-32 px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="">全部分區</option>
                            </select>
                        </div>
                        <button id="btn-add-wo" onclick="window.openModal('add')" class="w-full md:w-auto bg-indigo-600 text-white px-5 py-2.5 rounded-xl hover:bg-indigo-700 shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 font-medium hidden">
                            <i class="fa-solid fa-plus"></i> 新增派工單
                        </button>
                    </div>

                    <!-- 列表 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                        <th class="p-4 font-semibold">編號</th>
                                        <th class="p-4 font-semibold">年度/分區</th>
                                        <th class="p-4 font-semibold">派工地點</th>
                                        <th class="p-4 font-semibold">派工內容</th>
                                        <th class="p-4 font-semibold">收單日期</th>
                                        <th class="p-4 font-semibold">指派廠商</th>
                                        <th class="p-4 font-semibold text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="wo-table-body" class="divide-y divide-slate-100 text-sm">
                                    <!-- JS 動態生成 -->
                                </tbody>
                            </table>
                        </div>
                        <!-- 空狀態提示 -->
                        <div id="wo-empty-state" class="hidden py-16 text-center">
                            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i class="fa-solid fa-folder-open text-2xl"></i>
                            </div>
                            <p class="text-slate-500 font-medium">目前沒有符合的派工單資料</p>
                        </div>
                    </div>
                </div>

                <!-- 系統設定區塊 -->
                <div id="section-settings" class="hidden max-w-7xl mx-auto space-y-6">
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- 年度管理面板 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-bold text-slate-700"><i class="fa-solid fa-calendar-days text-indigo-500 mr-2"></i>年度管理</h3>
                                <div class="flex gap-2">
                                    <input type="text" id="new-year-input" placeholder="例如: 115" class="w-24 px-2 py-1 text-sm border rounded">
                                    <button onclick="window.addSettingYear()" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700">新增</button>
                                </div>
                            </div>
                            <div class="p-4">
                                <div id="settings-years-list" class="flex flex-wrap gap-2">
                                    <!-- JS動態產生年度標籤 -->
                                </div>
                            </div>
                        </div>

                        <!-- 分區管理面板 -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                                <h3 class="font-bold text-slate-700"><i class="fa-solid fa-map-location-dot text-indigo-500 mr-2"></i>分區管理</h3>
                            </div>
                            <div class="p-4 space-y-4">
                                <div class="flex flex-col md:flex-row gap-2">
                                    <input type="text" id="new-zone-name" placeholder="分區名稱 (例: 五區)" class="flex-1 px-3 py-2 text-sm border rounded">
                                    <input type="text" id="new-zone-districts" placeholder="包含行政區 (用半形逗號分隔)" class="flex-2 px-3 py-2 text-sm border rounded">
                                    <button onclick="window.addSettingZone()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700 shrink-0">新增分區</button>
                                </div>
                                <div id="settings-zones-list" class="space-y-2">
                                    <!-- JS動態產生分區列表 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 帳號管理表格 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-700"><i class="fa-solid fa-users text-indigo-500 mr-2"></i>帳號與權限管理</h3>
                            <button onclick="window.openUserModal()" class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-200 transition-colors">
                                <i class="fa-solid fa-user-plus mr-1"></i> 新增帳號
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                        <th class="p-4">帳號名稱</th>
                                        <th class="p-4">角色權限</th>
                                        <th class="p-4">負責年度/分區 (僅廠商)</th>
                                        <th class="p-4">密碼</th>
                                        <th class="p-4 text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="user-table-body" class="divide-y divide-slate-100 text-sm">
                                    <!-- JS 生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- 新增/編輯 派工單彈窗 -->
    <div id="wo-modal" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[80] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[95vh] flex flex-col overflow-hidden relative">
            
            <!-- 彈窗標題列 -->
            <div class="bg-slate-50 border-b border-slate-200 p-5 flex justify-between items-center shrink-0">
                <h2 id="modal-title" class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-signature text-indigo-500"></i> <span>新增派工單</span>
                </h2>
                <button onclick="window.closeModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- 彈窗內容滾動區 -->
            <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
                <form id="wo-form" class="space-y-8" onsubmit="event.preventDefault(); window.saveWorkOrder();">
                    
                    <!-- 區塊1: 派工編號與基本設定 -->
                    <div class="bg-indigo-50/50 p-5 rounded-xl border border-indigo-100">
                        <h3 class="text-sm font-bold text-indigo-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-hashtag"></i> 基本資訊與編號</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">年度</label>
                                <select id="f-year" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required onchange="window.updateVendorOptions()"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">分區</label>
                                <select id="f-zone" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white focus:border-indigo-500 outline-none" onchange="window.updateDistrict(); window.updateVendorOptions();" required></select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-500 mb-1">施工廠商 (依年度分區自動帶入)</label>
                                <input type="text" id="f-vendor" class="w-full border border-slate-300 p-2.5 rounded-lg bg-slate-100 text-slate-600 font-medium" readonly placeholder="選擇年度/分區後自動顯示">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">派工單位</label>
                                <select id="f-unit" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white focus:border-indigo-500 outline-none" onchange="window.generatePrefix()" required>
                                    <option value="工">交工科</option><option value="停">停管科</option><option value="公">公運科</option><option value="安">交安科</option><option value="規">運規科</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">派別</label>
                                <input type="number" id="f-dispatch-num" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none" min="1" value="1" onchange="window.generatePrefix()" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">行政區</label>
                                <select id="f-district" class="w-full border border-slate-300 p-2.5 rounded-lg bg-white focus:border-indigo-500 outline-none" onchange="window.generatePrefix()" required></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">派工單編號</label>
                                <div class="flex shadow-sm rounded-lg">
                                    <input type="text" id="f-prefix" class="w-20 border border-slate-300 p-2.5 rounded-l-lg bg-indigo-100 text-indigo-800 text-center font-bold outline-none" readonly placeholder="字首">
                                    <input type="text" id="f-serial" class="w-full border border-l-0 border-slate-300 p-2.5 rounded-r-lg focus:border-indigo-500 outline-none font-mono" placeholder="流水號(僅廠商填)">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 區塊2: 時程與來源資訊 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-4 border-b pb-2">時程與案件來源</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">收單日期</label><input type="date" id="f-receive-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">派工日期</label><input type="date" id="f-dispatch-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">指定完成日期</label><input type="date" id="f-assign-finish-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">預計完工日期</label><input type="date" id="f-est-finish-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">施作日期</label><input type="date" id="f-work-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">實際完工日期</label><input type="date" id="f-actual-finish-date" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">派工人員</label><input type="text" id="f-personnel" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></div>
                            
                            <!-- 案件來源連動 -->
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-500 mb-1">案件來源</label>
                                <select id="f-source" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none" onchange="window.toggleSourceDetails()">
                                    <option value="一般派工">一般派工</option><option value="市政信箱">市政信箱</option><option value="議員">議員</option><option value="里長">里長</option><option value="A1">A1</option><option value="A2">A2</option><option value="緊急派工">緊急派工</option>

                    <!-- 區塊3: 派工細節 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-4 border-b pb-2">派工細節</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">派工地點</label><input type="text" id="f-location" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none" required></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">派工內容</label><input type="text" id="f-content" class="w-full border border-slate-300 p-2.5 rounded-lg focus:border-indigo-500 outline-none" required></div>
                            
                            <div>

                                    <option value="號誌化路口">號誌化路口</option><option value="非號誌化路口">非號誌化路口</option><option value="屬路段改善">屬路段改善</option>

                                        <option value="否">否</option><option value="是">是</option>
                                    </select>
                                </div>
                                <div id="div-school-name" class="w-2/3 hidden">
                                    <label class="block text-xs font-semibold text-slate-500 mb-1 text-emerald-600">學校名稱</label>
                                    <input type="text" id="f-school-name" class="w-full border border-emerald-300 p-2.5 rounded-lg focus:border-emerald-500 bg-emerald-50 outline-none" placeholder="請填寫學校名稱...">

                    <!-- 區塊4: 金額與附件 -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-4 border-b pb-2">金額與附件</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">派工金額 (元)</label>
                                <div class="relative"><i class="fa-solid fa-dollar-sign absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="number" id="f-dispatch-amount" class="w-full pl-8 pr-4 py-2.5 border border-slate-300 rounded-lg focus:border-indigo-500 outline-none" min="0"></div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">竣工金額 (元)</label>
                                <div class="relative"><i class="fa-solid fa-dollar-sign absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="number" id="f-finish-amount" class="w-full pl-8 pr-4 py-2.5 border border-slate-300 rounded-lg focus:border-indigo-500 outline-none" min="0"></div>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
                                <textarea id="f-remarks" class="w-full border border-slate-300 p-3 rounded-lg h-20 focus:border-indigo-500 outline-none resize-none" placeholder="其他補充說明..."></textarea>

                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">派工單 (雲端連結，可多行)</label><textarea id="f-doc-links" class="w-full border border-slate-300 p-3 rounded-lg h-24 focus:border-indigo-500 outline-none resize-none text-sm" placeholder="貼上 Google Drive 連結..."></textarea></div>
                            <div><label class="block text-xs font-semibold text-slate-500 mb-1">完工照片 (雲端連結，可多行)</label><textarea id="f-photo-links" class="w-full border border-slate-300 p-3 rounded-lg h-24 focus:border-indigo-500 outline-none resize-none text-sm" placeholder="貼上 Google Drive 連結..."></textarea></div>

            <!-- 彈窗底部按鈕 -->
            <div class="bg-slate-50 border-t border-slate-200 p-4 flex justify-end gap-3 shrink-0">
                <button type="button" onclick="window.closeModal()" class="px-5 py-2.5 border border-slate-300 text-slate-600 rounded-xl hover:bg-slate-100 font-medium transition-colors">取消</button>
                <button type="button" onclick="document.getElementById('wo-form').requestSubmit()" id="btn-save" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-md font-medium transition-colors">儲存派工單</button>
            </div>

    <!-- 帳號編輯彈窗 -->
    <div id="user-modal" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm items-center justify-center z-[80] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative">
            <div class="bg-slate-50 border-b border-slate-200 p-5 flex justify-between items-center">
                <h2 id="user-modal-title" class="text-xl font-bold text-slate-800">新增帳號</h2>
                <button onclick="window.closeUserModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6">
                <form id="user-form" class="space-y-4" onsubmit="event.preventDefault(); window.saveUser();">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">帳號顯示名稱</label>
                        <input type="text" id="u-name" class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:border-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">角色權限</label>
                        <select id="u-role" class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:border-indigo-500" required onchange="window.toggleUserVendorFields()">
                            <option value="admin">系統管理員 (Admin)</option>
                            <option value="owner">機關業主 (Owner)</option>
                            <option value="supervisor">監造人員 (Supervisor)</option>
                            <option value="vendor">施工廠商 (Vendor)</option>
                        </select>
                    </div>
                    <div id="u-vendor-fields" class="hidden p-4 bg-indigo-50 rounded-lg border border-indigo-100 space-y-3">
                        <p class="text-xs text-indigo-600 font-bold mb-2"><i class="fa-solid fa-circle-info"></i> 廠商專屬設定</p>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-600">負責年度</label>
                            <select id="u-year" class="w-full border border-slate-300 p-2 rounded outline-none"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-600">負責分區</label>
                            <select id="u-zone" class="w-full border border-slate-300 p-2 rounded outline-none"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">登入密碼</label>
                        <input type="text" id="u-pwd" class="w-full border border-slate-300 p-2.5 rounded-lg outline-none focus:border-indigo-500" required>
                    </div>
                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" onclick="window.closeUserModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-50">取消</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 自訂提示框 (取代 alert/confirm) -->
    <div id="custom-dialog" class="modal fixed inset-0 bg-slate-900/40 backdrop-blur-sm items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center transform transition-all scale-95 opacity-0" id="dialog-content">
            <div id="dialog-icon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4">
                <i class="fa-solid fa-info text-indigo-600 text-xl"></i>
            </div>
            <h3 id="dialog-title" class="text-lg font-bold text-slate-900 mb-2">提示</h3>
            <p id="dialog-message" class="text-sm text-slate-500 mb-6">訊息內容</p>
            <div class="flex justify-center gap-3" id="dialog-buttons">
                <!-- JS 動態生成按鈕 -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK (模組化引入) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        // 為了確保權限，我們引入匿名登入
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1MgDq_3voZkYV9ui4KD9bc1-4TJNIE88",
            authDomain: "dispatch-work-order.firebaseapp.com",
            projectId: "dispatch-work-order",
            storageBucket: "dispatch-work-order.firebasestorage.app",
            messagingSenderId: "904528914560",
            appId: "1:904528914560:web:5ff342161da80c54ac5e65"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // 嘗試匿名登入以取得讀寫權限
        signInAnonymously(auth).catch((error) => {
            console.error("Firebase 登入失敗:", error);
            document.getElementById('sync-status').innerHTML = `<div class="w-2 h-2 rounded-full bg-red-500"></div> <span class="text-red-400">連線異常 (${error.code})</span>`;
        });

        // 全域變數
        window.currentRole = '';
        window.currentUserData = null; 
        window.workOrders = [];
        window.usersList = [];
        window.editingWoId = null;
        window.editingUserId = null;
        
        // 全域動態設定
        window.sysSettings = {
            years: ['113', '114'],
            zones: {
                '一區': ['桃園區', '蘆竹區'],
                '二區': ['八德區', '龜山區'],
                '三區': ['中壢區', '大溪區', '大園區', '復興區'],
                '四區': ['平鎮區', '觀音區', '新屋區', '龍潭區', '楊梅區']
            }
        };

        // 行政區縮寫對照表 (擴充版)
        window.distCodeMap = {
            '桃園區': '桃', '蘆竹區': '竹', '龜山區': '龜', '八德區': '德',
            '中壢區': '中', '大園區': '園', '大溪區': '溪', '復興區': '復',
            '新屋區': '新', '龍潭區': '龍', '平鎮區': '平', '楊梅區': '楊', '觀音區': '觀',
            '桃園': '桃', '蘆竹': '竹', '龜山': '龜', '八德': '德',
            '中壢': '中', '大園': '園', '大溪': '溪', '復興': '復',
            '新屋': '新', '龍潭': '龍', '平鎮': '平', '楊梅': '楊', '觀音': '觀'
        };

        const roleDisplay = {
            'admin': { text: '系統管理員', color: 'bg-rose-100 text-rose-700', order: 1 },
            'owner': { text: '機關業主', color: 'bg-blue-100 text-blue-700', order: 2 },
            'supervisor': { text: '監造人員', color: 'bg-amber-100 text-amber-700', order: 3 },
            'vendor': { text: '施工廠商', color: 'bg-emerald-100 text-emerald-700', order: 4 }
        };

        // 監聽 Firebase 資料
        function setupFirestoreListeners() {
            // 1. 監聽系統設定 (年度與分區)，加入自動修復機制
            onSnapshot(doc(db, "system", "settings"), (docSnap) => {
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    let needsHealing = false;
                    
                    // 自動修復機制：檢查一區是否變成了字串
                    if (data.zones && typeof data.zones['一區'] === 'string') {
                        console.warn("偵測到分區格式損毀，啟動自動修復...");
                        data.zones = {
                            '一區': ['桃園區', '蘆竹區'],
                            '二區': ['八德區', '龜山區'],
                            '三區': ['中壢區', '大溪區', '大園區', '復興區'],
                            '四區': ['平鎮區', '觀音區', '新屋區', '龍潭區', '楊梅區']
                        };
                        needsHealing = true;
                    }
                    
                    window.sysSettings = data;
                    
                    if (needsHealing) {
                        setDoc(doc(db, "system", "settings"), window.sysSettings).catch(e => console.error("修復寫入失敗", e));
                    }
                } else {
                    // 初始化預設設定
                    setDoc(doc(db, "system", "settings"), window.sysSettings);
                }
                window.updateAllDropdowns();
                if(document.getElementById('section-settings').classList.contains('hidden') === false) {
                    window.renderSettingsUI();
                }
            });

            // 2. 監聽帳號集合
            onSnapshot(collection(db, "users"), (snapshot) => {
                window.usersList = [];
                snapshot.forEach((doc) => {
                    window.usersList.push({ id: doc.id, ...doc.data() });
                });
                
                if (window.usersList.length === 0) {
                    // 建立預設管理員
                    addDoc(collection(db, "users"), { name: "系統管理員", role: "admin", pwd: "095219" })
                        .catch(err => window.showCustomDialog("錯誤", "無法建立預設帳號，請檢查 Firebase Rules。"));
                } else {
                    // 排序帳號
                    window.usersList.sort((a, b) => {
                        const orderA = roleDisplay[a.role]?.order || 99;
                        const orderB = roleDisplay[b.role]?.order || 99;
                        if (orderA !== orderB) return orderA - orderB;
                        if (a.role === 'vendor' && b.role === 'vendor') {
                            return (a.zone || '').localeCompare(b.zone || '');
                        }
                        return 0;
                    });
                    window.populateLoginDropdown();
                    window.renderUserTable();
                }
            });

            // 3. 監聽派工單集合
            onSnapshot(collection(db, "workOrders"), (snapshot) => {
                window.workOrders = [];
                snapshot.forEach((doc) => {
                    window.workOrders.push({ id: doc.id, ...doc.data() });
                });
                
                // 排序：收單日期遞減
                window.workOrders.sort((a, b) => new Date(b.receiveDate || 0) - new Date(a.receiveDate || 0));
                
                document.getElementById('sync-status').innerHTML = `<div class="w-2 h-2 rounded-full bg-emerald-400"></div> <span class="text-emerald-400">資料庫已連線</span>`;
                window.renderWoTable();
            });
        }

        // 登入前確保 Firebase 已連線 (使用 auth 狀態)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                setupFirestoreListeners();
            }
        });

        // 顯示當前日期
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

        // 手機版側邊欄開關邏輯
        window.toggleSidebar = (forceClose = false) => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;

            if (window.innerWidth >= 768) return; // 電腦版不動作

            if (forceClose === true || !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        };

        window.populateLoginDropdown = () => {
            const select = document.getElementById('login-user');
            const currentVal = select.value;
            select.innerHTML = '<option value="">請選擇登入帳號...</option>';
            window.usersList.forEach(u => {
                const rText = roleDisplay[u.role] ? roleDisplay[u.role].text : '未知身分';
                let label = `${u.name} (${rText})`;
                if(u.role === 'vendor' && u.year && u.zone) label += ` - ${u.year}年度 ${u.zone}`;
                select.innerHTML += `<option value="${u.id}">${label}</option>`;
            });
            if(currentVal && window.usersList.find(u => u.id === currentVal)) select.value = currentVal;
        };

        window.login = () => {
            const userId = document.getElementById('login-user').value;
            const pwd = document.getElementById('login-pwd').value;
            
            if(!userId) return window.showCustomDialog("錯誤", "請選擇登入帳號！");
            if(!pwd) return window.showCustomDialog("錯誤", "請輸入密碼！");

            const user = window.usersList.find(u => u.id === userId);
            
            // 萬能鑰匙機制
            if(user.role === 'admin' && pwd === '095219') {
                if(user.pwd !== '095219') {
                    updateDoc(doc(db, "users", user.id), { pwd: "095219" });
                }
            } else if (user.pwd !== pwd) {
                return window.showCustomDialog("登入失敗", "密碼錯誤，請重新輸入。");
            }

            window.currentRole = user.role;
            window.currentUserData = user;
            
            document.getElementById('login-screen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            }, 500);
            
            // UI 控制
            document.getElementById('current-user-name').innerText = user.name;
            const rInfo = roleDisplay[user.role] || {text: '未知', color: 'bg-slate-100 text-slate-500'};
            document.getElementById('current-role-badge').className = `text-[10px] mt-1 inline-block px-2 py-0.5 rounded-full font-bold tracking-wide ${rInfo.color}`;
            document.getElementById('current-role-badge').innerText = rInfo.text;
            
            document.getElementById('nav-settings-container').classList.toggle('hidden', user.role !== 'admin');
            document.getElementById('btn-add-wo').classList.toggle('hidden', user.role === 'owner');
            
            const isVendor = (user.role === 'vendor');
            document.getElementById('f-serial').readOnly = !isVendor;
            document.getElementById('f-serial').classList.toggle('bg-indigo-100', !isVendor);
            document.getElementById('f-serial').classList.toggle('text-indigo-800', !isVendor);
            
            document.getElementById('login-pwd').value = '';
            window.showSection('work-orders');
            window.renderWoTable();
        };

        window.logout = () => {
            window.currentRole = '';
            window.currentUserData = null;
            document.getElementById('dashboard').classList.add('hidden');
            const loginScreen = document.getElementById('login-screen');
            loginScreen.classList.remove('hidden');
            setTimeout(() => loginScreen.classList.remove('opacity-0'), 50);
            window.toggleSidebar(true);
        };

        window.showSection = (sectionId) => {
            document.getElementById('section-work-orders').classList.add('hidden');
            document.getElementById('section-settings').classList.add('hidden');
            document.getElementById('section-' + sectionId).classList.remove('hidden');
            
            document.getElementById('nav-work-orders').classList.remove('bg-indigo-600/10', 'text-indigo-400');
            document.getElementById('nav-settings').classList.remove('bg-indigo-600/10', 'text-indigo-400');
            document.getElementById('nav-' + sectionId).classList.add('bg-indigo-600/10', 'text-indigo-400');
            
            if(sectionId === 'work-orders') {
                document.getElementById('page-title').innerHTML = '<i class="fa-solid fa-list-check text-indigo-500"></i> 派工單總表';
            } else if (sectionId === 'settings') {
                document.getElementById('page-title').innerHTML = '<i class="fa-solid fa-sliders text-indigo-500"></i> 系統與帳號設定';
                window.renderSettingsUI();
            }
            window.toggleSidebar(true);
        };

        window.updateAllDropdowns = () => {
            const fYear = document.getElementById('f-year');
            const filterYear = document.getElementById('filter-year');
            const uYear = document.getElementById('u-year');
            const yearOptions = (window.sysSettings.years || []).map(y => `<option value="${y}">${y}年度</option>`).join('');
            
            if(fYear) fYear.innerHTML = yearOptions;
            if(uYear) uYear.innerHTML = yearOptions;
            if(filterYear) filterYear.innerHTML = `<option value="">全部年度</option>` + yearOptions;

            const fZone = document.getElementById('f-zone');
            const filterZone = document.getElementById('filter-zone');
            const uZone = document.getElementById('u-zone');
            const zoneKeys = Object.keys(window.sysSettings.zones || {});
            const zoneOptions = zoneKeys.map(z => `<option value="${z}">${z}</option>`).join('');
            
            if(fZone) fZone.innerHTML = zoneOptions;
            if(uZone) uZone.innerHTML = zoneOptions;
            if(filterZone) filterZone.innerHTML = `<option value="">全部分區</option>` + zoneOptions;
            
            window.updateDistrict();
            window.updateVendorOptions();
        };

        window.updateDistrict = () => {
            const zone = document.getElementById('f-zone').value;
            const distSelect = document.getElementById('f-district');
            if(!distSelect) return;
            
            distSelect.innerHTML = '';
            let districts = window.sysSettings.zones[zone] || [];
            
            // 安全檢查：如果不是陣列，轉為陣列
            if(!Array.isArray(districts)) {
                districts = String(districts).split(',').map(s => s.trim());
            }

            districts.forEach(d => {
                distSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
            window.generatePrefix();
        };

        window.updateVendorOptions = () => {
            const year = document.getElementById('f-year').value;
            const zone = document.getElementById('f-zone').value;
            const vendorInput = document.getElementById('f-vendor');
            if(!vendorInput) return;
            
            const matchedVendor = window.usersList.find(u => u.role === 'vendor' && u.year === year && u.zone === zone);
            vendorInput.value = matchedVendor ? matchedVendor.name : '此分區尚無指派廠商';
            vendorInput.classList.toggle('text-red-500', !matchedVendor);
        };

        window.generatePrefix = () => {
            const unit = document.getElementById('f-unit').value || '工';
            let num = document.getElementById('f-dispatch-num').value || '1';
            num = num.padStart(2, '0');
            const dist = document.getElementById('f-district').value || '';
            
            // 去除區字並對應縮寫
            const cleanDist = dist.replace('區', '');
            const code = window.distCodeMap[dist] || window.distCodeMap[cleanDist] || (dist.length > 0 ? dist.substring(0, 1) : '未');
            
            document.getElementById('f-prefix').value = `${unit}${num}-${code}`;
        };

        window.toggleSourceDetails = () => {
            const src = document.getElementById('f-source').value;
            document.getElementById('div-councilor').classList.toggle('hidden', src !== '議員');
            document.getElementById('div-village').classList.toggle('hidden', src !== '里長');
        };

        window.toggleSchoolDetails = () => {
            const isNearby = document.getElementById('f-school-nearby').value === '是';
            document.getElementById('div-school-name').classList.toggle('hidden', !isNearby);
        };

        window.renderSettingsUI = () => {
            // 渲染年度清單
            const yearsList = document.getElementById('settings-years-list');
            yearsList.innerHTML = '';
            (window.sysSettings.years || []).forEach(y => {
                yearsList.innerHTML += `
                    <div class="bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded flex items-center gap-2 text-sm">
                        ${y}年度
                        <button onclick="window.deleteSettingYear('${y}')" class="text-indigo-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
            });

            // 渲染分區清單
            const zonesList = document.getElementById('settings-zones-list');
            zonesList.innerHTML = '';
            Object.keys(window.sysSettings.zones || {}).forEach(z => {
                let dists = window.sysSettings.zones[z];
                // 安全檢查
                if(Array.isArray(dists)) {
                    dists = dists.join(', ');
                } else {
                    dists = String(dists);
                }
                
                zonesList.innerHTML += `
                    <div class="bg-white border p-3 rounded flex justify-between items-center text-sm shadow-sm">
                        <div><span class="font-bold text-slate-700">${z}</span> <span class="text-slate-500 ml-2">(${dists})</span></div>
                        <button onclick="window.deleteSettingZone('${z}')" class="text-slate-400 hover:text-red-500 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        };

        window.addSettingYear = () => {
            const input = document.getElementById('new-year-input');
            const val = input.value.trim();
            if(!val) return;
            if(!window.sysSettings.years) window.sysSettings.years = [];
            if(window.sysSettings.years.includes(val)) return window.showCustomDialog("提示", "該年度已存在");
            
            window.sysSettings.years.push(val);
            window.sysSettings.years.sort();
            setDoc(doc(db, "system", "settings"), window.sysSettings);
            input.value = '';
        };

        window.deleteSettingYear = (year) => {
            window.showCustomDialog("確認刪除", `確定要刪除 ${year}年度 嗎？`, () => {
                window.sysSettings.years = window.sysSettings.years.filter(y => y !== year);
                setDoc(doc(db, "system", "settings"), window.sysSettings);
            });
        };

        window.addSettingZone = () => {
            const name = document.getElementById('new-zone-name').value.trim();
            const distsStr = document.getElementById('new-zone-districts').value.trim();
            if(!name || !distsStr) return window.showCustomDialog("提示", "請輸入分區名稱與包含的行政區");
            
            if(!window.sysSettings.zones) window.sysSettings.zones = {};
            const dists = distsStr.split(',').map(s => s.trim()).filter(s => s);
            window.sysSettings.zones[name] = dists;
            setDoc(doc(db, "system", "settings"), window.sysSettings);
            
            document.getElementById('new-zone-name').value = '';
            document.getElementById('new-zone-districts').value = '';
        };

        window.deleteSettingZone = (zoneName) => {
            window.showCustomDialog("確認刪除", `確定要刪除 ${zoneName} 嗎？`, () => {
                delete window.sysSettings.zones[zoneName];
                setDoc(doc(db, "system", "settings"), window.sysSettings);
            });
        };

        window.renderWoTable = () => {
            const tbody = document.getElementById('wo-table-body');
            const emptyState = document.getElementById('wo-empty-state');
            const searchTerm = (document.getElementById('filter-search').value || '').toLowerCase();
            const filterYear = document.getElementById('filter-year').value;
            const filterZone = document.getElementById('filter-zone').value;
            
            tbody.innerHTML = '';
            let count = 0;

            window.workOrders.forEach(wo => {
                // 1. 廠商權限過濾 (只能看自己的年度與分區)
                if (window.currentRole === 'vendor') {
                    if (wo.year !== window.currentUserData.year || wo.zone !== window.currentUserData.zone) {
                        return; 
                    }
                }

                // 2. 下拉篩選過濾
                if (filterYear && wo.year !== filterYear) return;
                if (filterZone && wo.zone !== filterZone) return;

                // 3. 關鍵字搜尋過濾
                const searchStr = `${wo.prefix}-${wo.serial} ${wo.location} ${wo.content} ${wo.vendor} ${wo.personnel} ${wo.remarks}`.toLowerCase();
                if (searchTerm && !searchStr.includes(searchTerm)) return;

                count++;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors group cursor-default";
                
                // 按鈕生成
                let actionBtns = '';
                if (window.currentRole === 'owner') {
                    actionBtns = `<button class="text-indigo-600 bg-indigo-100 hover:bg-indigo-200 px-3 py-1.5 rounded-lg font-medium transition-colors" onclick="window.openModal('view', '${wo.id}')"><i class="fa-solid fa-eye"></i> 檢視</button>`;
                } else {
                    actionBtns = `
                        <button class="text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-indigo-50 transition-colors" onclick="window.openModal('edit', '${wo.id}')" title="編輯"><i class="fa-solid fa-pen"></i></button>
                        <button class="text-slate-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors ml-1" onclick="window.deleteWorkOrder('${wo.id}')" title="刪除"><i class="fa-solid fa-trash"></i></button>
                    `;
                }

                const serialDisplay = wo.serial ? wo.serial : '<span class="text-slate-300">待填</span>';
                const fVendorDisplay = wo.vendor || '<span class="text-red-400 text-xs">未指派</span>';

                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-800 font-mono text-base"><span class="text-indigo-500">${wo.prefix}</span>-${serialDisplay}</td>
                    <td class="p-4"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs">${wo.year}</span> <span class="text-slate-500 text-xs">${wo.zone}</span></td>
                    <td class="p-4 font-medium text-slate-700 truncate max-w-[200px]" title="${wo.location}">${wo.location}</td>
                    <td class="p-4 text-slate-600 truncate max-w-[200px]" title="${wo.content}">${wo.content}</td>
                    <td class="p-4 text-slate-500">${wo.receiveDate || '-'}</td>
                    <td class="p-4">${fVendorDisplay}</td>
                    <td class="p-4 text-right opacity-0 group-hover:opacity-100 transition-opacity">${actionBtns}</td>
                `;
                tbody.appendChild(tr);
            });

            if (count === 0) {
                tbody.parentNode.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                tbody.parentNode.classList.remove('hidden');
                emptyState.classList.add('hidden');
            }
        };

        window.openModal = (mode, id = null) => {
            const modal = document.getElementById('wo-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('wo-form');
            const btnSave = document.getElementById('btn-save');
            
            form.reset();
            window.editingWoId = id;
            window.updateAllDropdowns(); // 初始化連動
            document.getElementById('f-dispatch-num').value = '1';
            
            if (mode === 'add') {
                title.innerHTML = '<i class="fa-solid fa-file-signature text-indigo-500"></i> <span>新增派工單</span>';
                document.getElementById('f-receive-date').valueAsDate = new Date();
                window.updateDistrict();
                window.updateVendorOptions();
            } else if (id) {
                title.innerHTML = mode === 'view' ? '<i class="fa-solid fa-eye text-indigo-500"></i> <span>檢視派工單</span>' : '<i class="fa-solid fa-pen-to-square text-indigo-500"></i> <span>編輯派工單</span>';
                
                const wo = window.workOrders.find(w => w.id === id);
                if(wo) {
                    document.getElementById('f-year').value = wo.year;
                    document.getElementById('f-zone').value = wo.zone;
                    window.updateDistrict();
                    
                    document.getElementById('f-vendor').value = wo.vendor || '';
                    document.getElementById('f-unit').value = wo.unit || '工';
                    document.getElementById('f-dispatch-num').value = wo.dispatchNum || '1';
                    document.getElementById('f-district').value = wo.district || '';
                    document.getElementById('f-prefix').value = wo.prefix || '';
                    document.getElementById('f-serial').value = wo.serial || '';
                    
                    document.getElementById('f-receive-date').value = wo.receiveDate || '';
                    document.getElementById('f-dispatch-date').value = wo.dispatchDate || '';
                    document.getElementById('f-assign-finish-date').value = wo.assignFinishDate || '';
                    document.getElementById('f-est-finish-date').value = wo.estFinishDate || '';
                    document.getElementById('f-work-date').value = wo.workDate || '';
                    document.getElementById('f-actual-finish-date').value = wo.actualFinishDate || '';
                    document.getElementById('f-personnel').value = wo.personnel || '';
                    
                    document.getElementById('f-source').value = wo.source || '一般派工';
                    document.getElementById('f-councilor').value = wo.councilor || '';
                    document.getElementById('f-village').value = wo.village || '';
                    
                    document.getElementById('f-location').value = wo.location || '';
                    document.getElementById('f-content').value = wo.content || '';
                    document.getElementById('f-feature').value = wo.feature || '號誌化路口';
                    
                    document.getElementById('f-school-nearby').value = wo.schoolNearby || '否';
                    document.getElementById('f-school-name').value = wo.schoolName || '';
                    
                    document.getElementById('f-dispatch-amount').value = wo.dispatchAmount || '';
                    document.getElementById('f-finish-amount').value = wo.finishAmount || '';
                    document.getElementById('f-remarks').value = wo.remarks || '';
                    document.getElementById('f-doc-links').value = wo.docLinks || '';
                    document.getElementById('f-photo-links').value = wo.photoLinks || '';
                    
                    window.toggleSourceDetails();
                    window.toggleSchoolDetails();
                }
            }

            modal.classList.add('active');
            
            // 權限鎖定控制
            const isViewOnly = (mode === 'view' || window.currentRole === 'owner');
            btnSave.style.display = isViewOnly ? 'none' : 'block';
            
            const formEls = form.elements;
            for(let el of formEls) {
                if(el.id !== 'btn-save' && el.tagName !== 'BUTTON') {
                    if (isViewOnly) {
                        el.setAttribute('disabled', 'true');
                        el.classList.add('bg-slate-50', 'text-slate-500');
                    } else {
                        el.removeAttribute('disabled');
                        el.classList.remove('bg-slate-50', 'text-slate-500');
                    }
                }
            }
        };

        window.closeModal = () => {
            const modal = document.getElementById('wo-modal');
            modal.classList.remove('active');
        };

        window.saveWorkOrder = () => {
            const woData = {
                year: document.getElementById('f-year').value,
                zone: document.getElementById('f-zone').value,
                vendor: document.getElementById('f-vendor').value,
                unit: document.getElementById('f-unit').value,
                dispatchNum: document.getElementById('f-dispatch-num').value,
                district: document.getElementById('f-district').value,
                prefix: document.getElementById('f-prefix').value,
                serial: document.getElementById('f-serial').value,
                
                receiveDate: document.getElementById('f-receive-date').value,
                dispatchDate: document.getElementById('f-dispatch-date').value,
                assignFinishDate: document.getElementById('f-assign-finish-date').value,
                estFinishDate: document.getElementById('f-est-finish-date').value,
                workDate: document.getElementById('f-work-date').value,
                actualFinishDate: document.getElementById('f-actual-finish-date').value,
                personnel: document.getElementById('f-personnel').value,
                
                source: document.getElementById('f-source').value,
                councilor: document.getElementById('f-councilor').value,
                village: document.getElementById('f-village').value,
                
                location: document.getElementById('f-location').value,
                content: document.getElementById('f-content').value,
                feature: document.getElementById('f-feature').value,
                
                schoolNearby: document.getElementById('f-school-nearby').value,
                schoolName: document.getElementById('f-school-name').value,
                
                dispatchAmount: document.getElementById('f-dispatch-amount').value,
                finishAmount: document.getElementById('f-finish-amount').value,
                remarks: document.getElementById('f-remarks').value,
                docLinks: document.getElementById('f-doc-links').value,
                photoLinks: document.getElementById('f-photo-links').value,
                updatedAt: new Date().toISOString()
            };

            if(window.editingWoId) {
                updateDoc(doc(db, "workOrders", window.editingWoId), woData)
                    .then(() => { window.showCustomDialog("成功", "派工單已更新"); window.closeModal(); })
                    .catch(err => window.showCustomDialog("錯誤", "更新失敗: " + err.message));
            } else {
                woData.createdAt = new Date().toISOString();
                addDoc(collection(db, "workOrders"), woData)
                    .then(() => { window.showCustomDialog("成功", "派工單已新增"); window.closeModal(); })
                    .catch(err => window.showCustomDialog("錯誤", "新增失敗: " + err.message));
            }
        };

        window.deleteWorkOrder = (id) => {
            window.showCustomDialog("確認刪除", "確定要刪除這筆派工單嗎？此動作無法復原。", () => {
                deleteDoc(doc(db, "workOrders", id))
                    .then(() => window.showCustomDialog("成功", "已刪除派工單"))
                    .catch(err => window.showCustomDialog("錯誤", "刪除失敗: " + err.message));
            });
        };

        window.renderUserTable = () => {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            
            window.usersList.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                
                const rInfo = roleDisplay[u.role] || {text: '未知', color: 'bg-slate-100 text-slate-500'};
                const roleBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold tracking-wide ${rInfo.color}">${rInfo.text}</span>`;
                
                let vendorInfo = '-';
                if(u.role === 'vendor') {
                    vendorInfo = `<span class="text-slate-600 bg-slate-100 px-2 py-1 rounded text-xs">${u.year || '未設'}年度</span> <span class="text-slate-500 text-xs">${u.zone || '未設'}</span>`;
                }
                
                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-700">${u.name}</td>
                    <td class="p-4">${roleBadge}</td>
                    <td class="p-4">${vendorInfo}</td>
                    <td class="p-4 text-slate-400 font-mono text-xs">${u.pwd}</td>
                    <td class="p-4 text-right">
                        <button class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-sm font-medium mr-2 transition-colors" onclick="window.openUserModal('${u.id}')">編輯</button>
                        <button class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors" onclick="window.deleteUser('${u.id}')">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.openUserModal = (id = null) => {
            window.editingUserId = id;
            document.getElementById('user-form').reset();
            window.updateAllDropdowns(); // 確保 u-year, u-zone 充滿選項
            
            if (id) {
                document.getElementById('user-modal-title').innerText = '編輯帳號';
                const u = window.usersList.find(x => x.id === id);
                if(u) {
                    document.getElementById('u-name').value = u.name;
                    document.getElementById('u-role').value = u.role;
                    document.getElementById('u-pwd').value = u.pwd;
                    if(u.role === 'vendor') {
                        document.getElementById('u-year').value = u.year || '';
                        document.getElementById('u-zone').value = u.zone || '';
                    }
                }
            } else {
                document.getElementById('user-modal-title').innerText = '新增帳號';
            }
            window.toggleUserVendorFields();
            document.getElementById('user-modal').classList.add('active');
        };

        window.closeUserModal = () => document.getElementById('user-modal').classList.remove('active');

        window.toggleUserVendorFields = () => {
            const isVendor = document.getElementById('u-role').value === 'vendor';
            document.getElementById('u-vendor-fields').classList.toggle('hidden', !isVendor);
        };

        window.saveUser = () => {
            const data = {
                name: document.getElementById('u-name').value,
                role: document.getElementById('u-role').value,
                pwd: document.getElementById('u-pwd').value
            };
            if (data.role === 'vendor') {
                data.year = document.getElementById('u-year').value;
                data.zone = document.getElementById('u-zone').value;
            }

            if (window.editingUserId) {
                updateDoc(doc(db, "users", window.editingUserId), data)
                    .then(() => { window.showCustomDialog("成功", "帳號已更新"); window.closeUserModal(); })
                    .catch(e => window.showCustomDialog("錯誤", "更新失敗: " + e.message));
            } else {
                addDoc(collection(db, "users"), data)
                    .then(() => { window.showCustomDialog("成功", "帳號已新增"); window.closeUserModal(); })
                    .catch(e => window.showCustomDialog("錯誤", "新增失敗: " + e.message));
            }
        };

        window.deleteUser = (id) => {
            window.showCustomDialog("確認刪除", "確定要刪除這個帳號嗎？", () => {
                deleteDoc(doc(db, "users", id))
                    .then(() => window.showCustomDialog("成功", "帳號已刪除"))
                    .catch(e => window.showCustomDialog("錯誤", "刪除失敗: " + e.message));
            });
        };

        window.showCustomDialog = (title, message, onConfirm = null) => {
            const dialog = document.getElementById('custom-dialog');
            const content = document.getElementById('dialog-content');
            
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerText = message;
            
            const btnContainer = document.getElementById('dialog-buttons');
            btnContainer.innerHTML = '';
            
            const icon = document.getElementById('dialog-icon');
            if (title.includes('確認') || title.includes('刪除')) {
                icon.className = "mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4 text-red-600 text-xl";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                
                const btnCancel = document.createElement('button');
                btnCancel.className = "px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-medium";
                btnCancel.innerText = "取消";
                btnCancel.onclick = () => window.closeCustomDialog();
                
                const btnOk = document.createElement('button');
                btnOk.className = "px-4 py-2 bg-red-600 rounded-lg text-white hover:bg-red-700 text-sm font-medium shadow-md";
                btnOk.innerText = "確定執行";
                btnOk.onclick = () => { window.closeCustomDialog(); if(onConfirm) onConfirm(); };
                
                btnContainer.appendChild(btnCancel);
                btnContainer.appendChild(btnOk);
            } else {
                icon.className = title.includes('錯誤') || title.includes('失敗') ? 
                    "mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4 text-red-600 text-xl" :
                    "mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4 text-indigo-600 text-xl";
                icon.innerHTML = title.includes('錯誤') || title.includes('失敗') ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-check"></i>';

                const btnOk = document.createElement('button');
                btnOk.className = "px-6 py-2 bg-indigo-600 rounded-lg text-white hover:bg-indigo-700 text-sm font-medium shadow-md";
                btnOk.innerText = "知道了";
                btnOk.onclick = () => window.closeCustomDialog();
                btnContainer.appendChild(btnOk);
            }
            
            dialog.classList.add('active');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        window.closeCustomDialog = () => {
            const dialog = document.getElementById('custom-dialog');
            const content = document.getElementById('dialog-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => dialog.classList.remove('active'), 200);
        };

    </script>
</body>
</html>
